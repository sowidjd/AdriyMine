plugins { id 'com.android.application' }

def ks = rootProject.file('keystore/saku.jks')

android {
    namespace 'id.adriymine.remotionsaku'
    compileSdk 35
    defaultConfig {
        applicationId 'id.adriymine.remotionsaku'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }
    signingConfigs {
        release {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('SAKU_KS_PASS') ?: 'remotionsaku'
                keyAlias 'saku'
                keyPassword System.getenv('SAKU_KS_PASS') ?: 'remotionsaku'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // index.html berukuran besar; jangan dikompres agar cepat dibaca
    androidResources { noCompress 'html' }
}
