  shape(pts, col, id, o = {}) {   // a carved block: flat ink colour, white gouge strokes on dark areas, ink hatch on light areas, thick edge

    const lum = (() => { const v = parseInt(col.slice(1), 16); return ((v >> 16) * .3 + ((v >> 8) & 255) * .59 + (v & 255) * .11) / 255; })();

  line(pts, lw, col = INK, id, a = 1) { ctx.strokeStyle = rgba(col, a); ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(pathOf(pts, false)); },

const age = id => T - t0(id);
