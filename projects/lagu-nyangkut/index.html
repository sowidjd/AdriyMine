<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lagu nyangkut</title>
<style>
@font-face { font-family: 'Fredoka'; src: url(../_bersama/fonts/fredoka-latin.woff2) format('woff2'); font-weight: 300 700; }
html,body{margin:0;background:#222}canvas{height:100vh;display:block;margin:auto}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../_bersama/dasar.js"></script>
<script>
// "Lagu nyangkut dari bangun tidur, padahal kamu nggak suka" — gaya SKETCHBOOK: pensil grafit di buku bergaris + SATU warna aksen (oranye):
// hanya Clawd, si "cacing telinga" dan not lagunya yang berwarna. Metafora: lagu = cacing kecil yang berputar-putar di kepala.
const GR = '#4A4744', ACC = '#E07A4F';
let GRAIN = null;
const GAYA = {
  ink: '#2E2C2A', hi: '#F4B183', card: '#FFFDF6',
  init() { GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 200; const q = GRAIN.getContext('2d'), im = q.createImageData(200, 200);
    for (let i = 0; i < 40000; i++) { const v = 225 + 30 * hash(i * .77 + 1); im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v - 4; im.data[i * 4 + 3] = 255; } q.putImageData(im, 0, 0); },
  shape(pts, col, id, o = {}) {   // light graphite hatch (or accent wash) + double sketchy contour that boils
    const p = pathOf(pts), b = bbox(pts), accent = col !== GR && !o.text;
    ctx.fillStyle = rgba(col, o.text ? .96 : accent ? .5 : .14); ctx.fill(p);
    if (!o.text && (o.hatch ?? true)) { ctx.save(); ctx.clip(p); ctx.strokeStyle = rgba(accent ? mixh(col, '#5A2A18', .3) : GR, accent ? .35 : .3); ctx.lineWidth = 2; ctx.beginPath();
      for (let x = b[0] - (b[3] - b[1]); x < b[2]; x += o.gap ?? 11) { ctx.moveTo(x, b[3]); ctx.lineTo(x + (b[3] - b[1]), b[1]); } ctx.stroke(); ctx.restore(); }
    for (let k = 0; k < (o.text ? 1 : 2); k++) sketch(pts, true, id * 3 + k, o.lw ?? 3, '#2E2C2A', k ? .35 : .85, k ? 2.2 : 1.1);
  },
  line(pts, lw, col = '#2E2C2A', id = 1, alpha = 1) { sketch(pts, false, id, lw, col, alpha, 1); },
  bg() {   // notebook page: blue rules + red margin
    ctx.fillStyle = '#FBF8EF'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(110,150,200,0.35)'; ctx.lineWidth = 2; for (let y = 200; y < H; y += 56) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(220,90,90,0.4)'; ctx.beginPath(); ctx.moveTo(110, 0); ctx.lineTo(110, H); ctx.stroke();
  },
  trans(k, drawPrev) {   // page turn: the old page slides off to the left with a soft shadow at its edge
    const x = -easeIn(k) * (W + 80);
    ctx.save(); ctx.translate(x, 0); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip(); drawPrev(); ctx.restore();
    const g = ctx.createLinearGradient(x + W, 0, x + W + 60, 0); g.addColorStop(0, 'rgba(0,0,0,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x + W, 0, 60, H);
  },
  post(t) { ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .35; ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; },
};
function sketch(pts, closed, id, lw, col, alpha, j) {   // a pencil stroke: jittered points, re-drawn 12×/s (line boil)
  const k = BOIL; ctx.strokeStyle = rgba(col, alpha); ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  const n = pts.length; pts.forEach(([x, y], i) => { const px = x + (hash(id * 31 + i * 7 + k * 101) - .5) * 2 * j, py = y + (hash(id * 17 + i * 5 + k * 59) - .5) * 2 * j; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  if (closed) ctx.closePath(); ctx.stroke();
}
function shade(a) { if (a > 0) { ctx.fillStyle = `rgba(60,70,95,${a})`; ctx.fillRect(0, 0, W, H); } }   // pencil-dim light (morning gloom)
function warm(a) { if (a > 0) { const g = ctx.createRadialGradient(540, 700, 0, 540, 700, 1100); g.addColorStop(0, `rgba(255,200,120,${a})`); g.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); } }
// the earworm: a small orange worm with headphones, wiggling; music notes trail behind
function worm(x, y, s, o = {}) {
  const P = []; for (let i = 0; i < 6; i++) P.push([x - i * 16 * s, y + Math.sin(T * 8 - i * .9) * 7 * s]);
  for (let i = 5; i >= 0; i--) GAYA.shape(ell(P[i][0], P[i][1], (13 - i) * s, (12 - i) * s, 14), ACC, 3000 + i, { hatch: false, lw: 2.4 });
  ctx.fillStyle = '#2E2C2A'; ctx.beginPath(); ctx.arc(x + 5 * s, y - 4 * s, 2.6 * s, 0, TAU); ctx.fill();
  if (o.happy !== false) GAYA.line([[x - 1 * s, y + 4 * s], [x + 5 * s, y + 7 * s], [x + 10 * s, y + 3 * s]], 2.2, '#2E2C2A', 3010);
  GAYA.line([[x - 9 * s, y - 6 * s], [x - 2 * s, y - 20 * s], [x + 11 * s, y - 10 * s]], 3, GR, 3011); GAYA.shape(ell(x - 9 * s, y - 5 * s, 4 * s, 6 * s, 10), GR, 3012, { lw: 2 });
}
function note(x, y, s, id) { GAYA.shape(ell(x, y, 13 * s, 10 * s, 12, -.4), ACC, id, { hatch: false, lw: 2.4 }); GAYA.line([[x + 12 * s, y - 2 * s], [x + 12 * s, y - 52 * s], [x + 30 * s, y - 40 * s]], 3.4, '#2E2C2A', id + 1); }
function orbit(cx, cy, rx, ry, t, n = 5, s = 1, speed = 1.6, id = 3100) { for (let i = 0; i < n; i++) { const a = t * speed + i / n * TAU; note(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, s, id + i * 3); } }
function head(cx, cy, s, id = 3200) {   // a side-profile head (looking right), outline only
  const P = [[-150, 120], [-170, 0], [-150, -120], [-80, -190], [20, -200], [110, -150], [150, -60], [160, 0], [185, 40], [155, 60], [160, 100], [140, 130], [120, 180], [60, 190], [40, 260], [-90, 260], [-100, 180]].map(([x, y]) => [cx + x * s, cy + y * s]);
  GAYA.shape(P, GR, id, { gap: 24 });
}
function gum(x, y, s, id = 3300) { GAYA.shape(rr(x - 70 * s, y - 40 * s, 140 * s, 80 * s, 12 * s), ACC, id, {}); ctx.font = `700 ${30 * s}px ${FONT}`; ctx.fillStyle = '#FFFDF6'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('GUM', x, y + 2 * s); ctx.textAlign = 'left'; }
// ---------- scenes ----------
GROUPS = [['hook', ['h1', 'h2', 'h3']], ['nama', ['k1', 'k2']], ['lawan', ['k3']], ['brand', ['a1', 'a1b']], ['riset', ['f1', 'f2']], ['hasil', ['f3']], ['kenapa', ['x1', 'x2']],
  ['trik', ['s1']], ['cta', ['c1', 'c2']], ['akhir', ['z']]];
// HOOK: grey morning in bed; the worm crawls out of Clawd's ear and starts its loop; then: gum
S.hook = (t) => {
  shade(.16 * (1 - seg(t, t0('h3'), t0('h3') + .6))); GAYA.shape([[640, 470], [980, 470], [980, 800], [640, 800]], GR, 100, { gap: 14 }); ctx.fillStyle = `rgba(255,190,120,${.35 + .3 * seg(t, t0('h3'), t0('h3') + .6)})`; ctx.fillRect(644, 474, 332, 322);   // window, sunrise
  GAYA.shape([[-20, 1150], [1100, 1150], [1100, 1700], [-20, 1700]], GR, 101, { gap: 18 }); GAYA.shape([[60, 1060], [420, 1060], [440, 1160], [40, 1160]], GR, 102, { hatch: false });   // bed & pillow
  const angry = t > t0('h2'), gumOn = t > t0('h3');
  clawd(380, 1150, 26, { face: gumOn ? 'curious' : angry ? 'squint' : 'sleepy', arms: angry && !gumOn ? [1.6, 1.6] : [.2, .2], mark: angry && !gumOn ? 'cloud' : null, markAge: t - t0('h2') });
  const out = seg(t, .3, 1.6); if (out > 0) { orbit(380, 880, 260, 90, t, angry ? 7 : 4, angry ? 1.2 : 1, angry ? 2.6 : 1.6); worm(lerp(380, 380 + Math.cos(t * 1.6) * 260, out), lerp(1020, 880 + Math.sin(t * 1.6) * 90, out), 1.6); }
  if (gumOn) { const a = t - t0('h3'); ctx.save(); ctx.translate(780, 1000); ctx.scale(backOut(seg(a, .3, .6)), backOut(seg(a, .3, .6))); gum(0, 0, 2); ctx.restore(); mark('sparkle', 840, 900, 30, a - .5); }
  if (t < t0('h2')) tag('Bangun tidur, *udah ada lagu*', 540, 330, 76, { age: t + .3 });
  else if (t < t0('h3')) tag('Nggak suka, *tapi muter terus!*', 540, 330, 72, { age: t - t0('h2') });
  else tag('Obatnya? *Permen karet*', 540, 330, 84, { age: t - t0('h3') });
};
// NAMA: inside the head the worm runs a loop track; then a cassette loop "short piece, again and again"
S.nama = (t) => {
  if (t < t0('k2')) { head(470, 820, 1.9); const a = t - t0('k1');
    ctx.save(); ctx.setLineDash([12, 12]); GAYA.line(ell(500, 700, 180, 90, 40).concat([[680, 700]]), 3, ACC, 3400, .8); ctx.restore();
    worm(500 + Math.cos(t * 2) * 180, 700 + Math.sin(t * 2) * 90, 1.8); orbit(500, 700, 180, 90, t + 1, 3, .8, 2);
    tag('*earworm*', 540, 1180, 96, { age: a - .5, rot: -.03 }); tag('= cacing telinga', 540, 1290, 56, { age: a - 1.2, bare: true }); return; }
  const a = t - t0('k2'), sp = t * 3;   // cassette
  GAYA.shape(rr(190, 560, 700, 440, 30), GR, 3500, { gap: 14 }); GAYA.shape(rr(290, 640, 500, 170, 20), '#FFFDF6', 3501, { text: true });
  for (const x of [400, 680]) { GAYA.shape(ell(x, 725, 60, 60, 24), GR, 3502 + x, { hatch: false }); for (let i = 0; i < 6; i++) { const an = sp + i * TAU / 6; GAYA.line([[x, 725], [x + Math.cos(an) * 50, 725 + Math.sin(an) * 50]], 3, '#2E2C2A', 3510 + i); } }
  ctx.font = `700 120px ${FONT}`; ctx.fillStyle = ACC; ctx.textAlign = 'center'; ctx.save(); ctx.translate(540, 1170); ctx.rotate(t * 3); ctx.fillText('↻', 0, 40); ctx.restore(); ctx.textAlign = 'left';
  orbit(540, 400, 300, 50, t, 4, 1, 3);
};
// LAWAN: Clawd tries to push the song out of the door; it bounces right back in
S.lawan = (t) => {
  const a = t - t0('k3'); GAYA.shape([[640, 520], [900, 520], [900, 1240], [640, 1240]], GR, 3600, { gap: 14 });
  const push = seg(a, .2, 1.2), back = seg(a, 1.4, 2.0), wx = lerp(lerp(500, 980, push), 360, back);
  worm(wx, 900 + Math.sin(t * 6) * 10, 2); orbit(wx, 900, 150, 70, t, 3, .8, 3);
  clawd(380, 1240, 26, { face: back > 0 ? 'squint' : 'worried', arms: back > 0 ? [1.6, 1.6] : [1.2, .2], mark: back > 0 ? '!' : 'sweat', markAge: back > 0 ? a - 1.4 : a });
  if (back > 0) tag('*Malah muter lagi!*', 540, 330, 84, { age: a - 1.5, rot: -.03 }); else tag('Dicoba dilupain...', 540, 330, 72, { age: a });
};
// BRAND: warm page, stamp, Clawd laughing
S.brand = (t) => {
  warm(.35); const st = t1('a1') - .15, bAge = t - st;
  clawd(540, 1260, 32, { face: t < st ? 'curious' : t < t0('a1b') ? 'happy' : 'laugh', arms: bAge > 0 && t < t0('a1b') + .3 ? [.6, 1.45] : [1.2, 1.2], dy: t > t0('a1b') ? -.5 * Math.abs(Math.sin(t * 9)) : 0 });
  if (bAge > -.1) brandStamp(540, 560, bAge, TL.duration);
};
// RISET: a 14×7 grid = 98 people, each with a note; half of them get gum
S.riset = (t) => {
  const a = t - t0('f1');
  tag('Univ. Reading, *Inggris*', 540, 300, 64, { age: a - .1 });
  for (let i = 0; i < 98; i++) { const q = i % 14, r = Math.floor(i / 14), x = 150 + q * 60, y = 480 + r * 92, on = a > .4 + i * .015; if (!on) continue;
    const chew = t > t0('f2') && q >= 7;
    GAYA.shape(ell(x, y, 18, 18, 10), chew ? ACC : GR, 3700 + i, { hatch: false, lw: 2 }); GAYA.line([[x - 16, y + 40], [x, y + 20], [x + 16, y + 40]], 2.5, '#2E2C2A', 3800 + i, .8);
    if (!chew) note(x + 8, y - 26, .5, 3900 + i * 2); }
  ctx.font = `700 120px ${FONT}`; ctx.fillStyle = ACC; ctx.textAlign = 'center'; if (t < t0('f2')) ctx.fillText('98', 540, 1260); ctx.textAlign = 'left';
  if (t > t0('f2')) { gum(760, 1220, 1.6); tag('Sebagian *ngunyah*', 330, 1230, 56, { age: t - t0('f2') - .3 }); }
};
// HASIL: two bars: the gum group "hears" the song less often (no fake numbers: shapes only)
S.hasil = (t) => {
  const a = t - t0('f3'); GAYA.line([[180, 1150], [900, 1150]], 4, '#2E2C2A', 4000); GAYA.line([[180, 1150], [180, 520]], 4, '#2E2C2A', 4001);
  const g1 = ease(seg(a, .5, 1.5)), g2 = ease(seg(a, 1.2, 2.2));
  GAYA.shape([[260, 1150], [460, 1150], [460, 1150 - 520 * g1], [260, 1150 - 520 * g1]], GR, 4002, {}); GAYA.shape([[600, 1150], [800, 1150], [800, 1150 - 340 * g2], [600, 1150 - 340 * g2]], ACC, 4003, {});
  if (g1 > .9) orbit(360, 560, 90, 30, t, 4, .7, 2); if (g2 > .9) orbit(700, 760, 70, 24, t, 2, .7, 2);
  ctx.font = `700 46px ${FONT}`; ctx.fillStyle = '#2E2C2A'; ctx.textAlign = 'center'; ctx.fillText('tanpa', 360, 1210); ctx.fillText('ngunyah', 700, 1210); ctx.textAlign = 'left';
  tag('"Lagunya muncul"', 540, 330, 60, { age: a - .2, bare: true }); clawd(940, 1330, 12, { face: g2 > .9 ? 'star' : 'curious' });
};
// KENAPA: the "inner mouth" sings the song; chewing keeps it busy; the concert in the head is cancelled
S.kenapa = (t) => {
  head(470, 820, 1.9); const chew = t > t0('x1') + 3, a = t - t0('x1');
  ctx.save(); ctx.translate(510, 720); const k = chew ? .5 + .5 * Math.sin(t * 14) : .5 + .5 * Math.sin(t * 6);   // the little mouth inside
  GAYA.shape(ell(0, 0, 90, 20 + 40 * k, 20), ACC, 4100, { hatch: false }); ctx.restore();
  if (!chew) orbit(510, 720, 180, 80, t, 4, .9, 2); else { for (let i = 0; i < 4; i++) { const p = seg(a, 3 + i * .2, 4 + i * .2); note(400 + i * 80, lerp(650, 1100, easeIn(p)), .9, 4110 + i * 3); } gum(860, 1110, 1.4); }
  tag(chew ? 'Mulut *sibuk ngunyah*' : '"Nyanyi" = *ngomong dalam hati*', 540, 330, 62, { age: chew ? a - 3 : a - .2 });
  if (t > t0('x2')) { const b = t - t0('x2'); ctx.save(); ctx.translate(540, 1250); ctx.rotate(-.06); ctx.scale(backOut(seg(b, 0, .3)), backOut(seg(b, 0, .3))); GAYA.shape(rr(-260, -70, 520, 140, 16), '#FFFDF6', 4120, { text: true }); ctx.font = `700 76px ${FONT}`; ctx.fillStyle = '#C9433E'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('KONSER BUBAR', 0, 4); ctx.textAlign = 'left'; ctx.restore(); }
};
// TRIK: Clawd chews; the worm waves goodbye and fades; morning turns bright
S.trik = (t) => {
  warm(.25); const a = t - t0('s1'), bye = seg(a, 1.5, 3.5);
  clawd(540, 1250, 32, { face: 'happy', mouth: 'chew', arms: [.3, .3], mark: bye > .9 ? 'sparkle' : null, markAge: a - 3.5 });
  ctx.save(); ctx.globalAlpha = 1 - bye; worm(700 + bye * 300, 760 - bye * 200, 2); orbit(700 + bye * 300, 760 - bye * 200, 140, 50, t, 3, .7, 2); ctx.restore();
  tag('Lagu bandel? *Kunyah permen karet*', 540, 330, 60, { age: a - .2 });
};
// CTA: a page to write the song title in; arrow to comments; follow
S.cta = (t) => {
  const a = t - t0('c1');
  GAYA.shape(rr(150, 420, 780, 480, 24), '#FFFDF6', 4200, { text: true });
  ctx.font = `700 54px ${FONT}`; ctx.fillStyle = '#2E2C2A'; ctx.fillText('Lagu yang nyangkut', 210, 510); ctx.fillText('di kepalaku:', 210, 580);
  for (let i = 0; i < 3; i++) GAYA.line([[210, 680 + i * 80], [870, 680 + i * 80]], 3, GR, 4210 + i, .6);
  const w = seg(a, 1, 4); if (w > 0) { ctx.save(); ctx.beginPath(); ctx.rect(210, 610, 660 * w, 80); ctx.clip(); GAYA.line(Array.from({ length: 40 }, (_, i) => [220 + i * 16, 660 + 10 * Math.sin(i * 1.7)]), 4, '#2E2C2A', 4220); ctx.restore(); }
  if (t > t0('c1') + 2.2) tag('Tulis di *komentar!*', 540, 1030, 70, { age: t - t0('c1') - 2.2 });
  clawd(500, 1330, 22, { face: 'happy', arms: [.3, 1.4], dy: -.3 * Math.abs(Math.sin(t * 4)) });
  if (t > t0('c2')) { const b = t - t0('c2'), k = backOut(seg(b, 0, .3)); ctx.save(); ctx.translate(800, 1200); ctx.scale(k, k); GAYA.shape(ell(0, 0, 60, 60, 24), ACC, 4230, {}); ctx.font = `700 90px ${FONT}`; ctx.fillStyle = '#FFFDF6'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('+', 0, 4); ctx.textAlign = 'left'; ctx.restore(); }
};
S.akhir = (t) => S.cta(t);
// ---------- sound ----------
window.cues = () => {
  c(0, 'mk:cartoon-vocal-yawn', .6); c(.3, 'pops/pop-small-bubble', .5); c(t0('h2'), 'mk:boing-hit-sound', .4); c(t0('h3') + .3, 'shimmers/shimmer-medium-sparkle', .6);
  c(t0('k1') + .5, 'writing-and-drawing/writing-pencil-write', .4); c(t0('k2'), 'mk:hard-pop-click', .6);
  c(t0('k3') + .3, 'whooshes/whoosh-medium-medium', .6); c(t0('k3') + 1.4, 'mk:boing-hit-sound', .7);
  c(t1('a1') - .15, 'logo-stings/sting-bright-short', 1); c(t0('a1b'), 'mk:crowd-laugh', .4);
  c(t0('f1') + .4, 'data/data-progress-long', .4); c(t0('f2') + .2, 'pops/pop-medium-in', .6);
  c(t0('f3') + .5, 'data/data-bar-grow', .6); c(t0('f3') + 1.2, 'data/data-bar-grow', .6); c(t0('f3') + 2.3, 'mk:correct-answer-tone', .6);
  c(t0('x1') + 3, 'mk:chewing-something-crunchy', .5); c(t0('x2'), 'mk:cartoon-failure-piano', .5); c(t0('x2') + .1, 'impacts/impact-medium-firm', .5);
  c(t0('s1') + .3, 'mk:chewing-something-crunchy', .4); c(t0('s1') + 3.5, 'shimmers/shimmer-long-soft', .5);
  c(t0('c1') + 1, 'writing-and-drawing/writing-pencil-write', .5); c(t0('c1') + 2.2, 'tones/tone-ding-mid', .6); c(t0('c2'), 'pops/pop-large-in', .6);
  c(t0('z') - .3, 'logo-stings/sting-warm-long', 1);
  for (const s of SC.slice(1)) if (s.name !== 'akhir') c(s.a, 'writing-and-drawing/writing-scribble', .3);
};
</script>
