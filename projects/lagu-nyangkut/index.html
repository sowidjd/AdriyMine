<!doctype html>
<html>
<head><meta charset="utf-8"><title>Lagu nyangkut</title>
<style>
@font-face { font-family: 'Fredoka'; src: url(../_bersama/fonts/fredoka-latin.woff2) format('woff2'); font-weight: 300 700; }
html,body{margin:0;background:#222}canvas{height:100vh;display:block;margin:auto}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../_bersama/dasar.js"></script>
<script>
// "Lagu nyangkut dari bangun tidur, padahal kamu nggak suka" — gaya SKETCHBOOK: pensil grafit di buku bergaris + SATU warna aksen (oranye):
// hanya Clawd, si "cacing telinga" dan not lagunya yang berwarna. Metafora: lagu = cacing kecil yang berputar-putar di kepala.
const GR = '#4A4744', ACC = '#E07A4F';
let GRAIN = null;
const GAYA = {
  ink: '#2E2C2A', hi: '#F4B183', card: '#FFFDF6',
  init() { GRAIN = document.createElement('canvas'); GRAIN.width = GRAIN.height = 200; const q = GRAIN.getContext('2d'), im = q.createImageData(200, 200);
    for (let i = 0; i < 40000; i++) { const v = 225 + 30 * hash(i * .77 + 1); im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v - 4; im.data[i * 4 + 3] = 255; } q.putImageData(im, 0, 0); },
  shape(pts, col, id, o = {}) {   // light graphite hatch (or accent wash) + double sketchy contour that boils
    const p = pathOf(pts), b = bbox(pts), accent = col !== GR && !o.text;
    ctx.fillStyle = rgba(col, o.text ? .96 : accent ? .5 : .14); ctx.fill(p);
    if (!o.text && (o.hatch ?? true)) { ctx.save(); ctx.clip(p); ctx.strokeStyle = rgba(accent ? mixh(col, '#5A2A18', .3) : GR, accent ? .35 : .3); ctx.lineWidth = 2; ctx.beginPath();
      for (let x = b[0] - (b[3] - b[1]); x < b[2]; x += o.gap ?? 11) { ctx.moveTo(x, b[3]); ctx.lineTo(x + (b[3] - b[1]), b[1]); } ctx.stroke(); ctx.restore(); }
    for (let k = 0; k < (o.text ? 1 : 2); k++) sketch(pts, true, id * 3 + k, o.lw ?? 3, '#2E2C2A', k ? .35 : .85, k ? 2.2 : 1.1);
  },
  line(pts, lw, col = '#2E2C2A', id = 1, alpha = 1) { sketch(pts, false, id, lw, col, alpha, 1); },
  bg() {   // notebook page: blue rules + red margin
    ctx.fillStyle = '#FBF8EF'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(110,150,200,0.35)'; ctx.lineWidth = 2; for (let y = 200; y < H; y += 56) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(220,90,90,0.4)'; ctx.beginPath(); ctx.moveTo(110, 0); ctx.lineTo(110, H); ctx.stroke();
  },
  trans(k, drawPrev) {   // page turn: the old page slides off to the left with a soft shadow at its edge
    const x = -easeIn(k) * (W + 80);
    ctx.save(); ctx.translate(x, 0); ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip(); drawPrev(); ctx.restore();
    const g = ctx.createLinearGradient(x + W, 0, x + W + 60, 0); g.addColorStop(0, 'rgba(0,0,0,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x + W, 0, 60, H);
  },
  post(t) { ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .35; ctx.fillStyle = ctx.createPattern(GRAIN, 'repeat'); ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; },
};
function sketch(pts, closed, id, lw, col, alpha, j) {   // a pencil stroke: jittered points, re-drawn 12×/s (line boil)
  const k = BOIL; ctx.strokeStyle = rgba(col, alpha); ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
  const n = pts.length; pts.forEach(([x, y], i) => { const px = x + (hash(id * 31 + i * 7 + k * 101) - .5) * 2 * j, py = y + (hash(id * 17 + i * 5 + k * 59) - .5) * 2 * j; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
  if (closed) ctx.closePath(); ctx.stroke();
}
function shade(a) { if (a > 0) { ctx.fillStyle = `rgba(60,70,95,${a})`; ctx.fillRect(0, 0, W, H); } }   // pencil-dim light (morning gloom)
function warm(a) { if (a > 0) { const g = ctx.createRadialGradient(540, 700, 0, 540, 700, 1100); g.addColorStop(0, `rgba(255,200,120,${a})`); g.addColorStop(1, 'rgba(255,200,120,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); } }
// the earworm: a small orange worm with headphones, wiggling; music notes trail behind
function worm(x, y, s, o = {}) {
  const P = []; for (let i = 0; i < 6; i++) P.push([x - i * 16 * s, y + Math.sin(T * 8 - i * .9) * 7 * s]);
  for (let i = 5; i >= 0; i--) GAYA.shape(ell(P[i][0], P[i][1], (13 - i) * s, (12 - i) * s, 14), ACC, 3000 + i, { hatch: false, lw: 2.4 });
  ctx.fillStyle = '#2E2C2A'; ctx.beginPath(); ctx.arc(x + 5 * s, y - 4 * s, 2.6 * s, 0, TAU); ctx.fill();
  if (o.happy !== false) GAYA.line([[x - 1 * s, y + 4 * s], [x + 5 * s, y + 7 * s], [x + 10 * s, y + 3 * s]], 2.2, '#2E2C2A', 3010);
  GAYA.line([[x - 9 * s, y - 6 * s], [x - 2 * s, y - 20 * s], [x + 11 * s, y - 10 * s]], 3, GR, 3011); GAYA.shape(ell(x - 9 * s, y - 5 * s, 4 * s, 6 * s, 10), GR, 3012, { lw: 2 });
}
function note(x, y, s, id) { GAYA.shape(ell(x, y, 13 * s, 10 * s, 12, -.4), ACC, id, { hatch: false, lw: 2.4 }); GAYA.line([[x + 12 * s, y - 2 * s], [x + 12 * s, y - 52 * s], [x + 30 * s, y - 40 * s]], 3.4, '#2E2C2A', id + 1); }
function orbit(cx, cy, rx, ry, t, n = 5, s = 1, speed = 1.6, id = 3100) { for (let i = 0; i < n; i++) { const a = t * speed + i / n * TAU; note(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, s, id + i * 3); } }
function head(cx, cy, s, id = 3200) {   // a side-profile head (looking right), outline only
  const P = [[-150, 120], [-170, 0], [-150, -120], [-80, -190], [20, -200], [110, -150], [150, -60], [160, 0], [185, 40], [155, 60], [160, 100], [140, 130], [120, 180], [60, 190], [40, 260], [-90, 260], [-100, 180]].map(([x, y]) => [cx + x * s, cy + y * s]);
  GAYA.shape(P, GR, id, { gap: 24 });
}
function gum(x, y, s, id = 3300) { GAYA.shape(rr(x - 70 * s, y - 40 * s, 140 * s, 80 * s, 12 * s), ACC, id, {}); ctx.font = `700 ${30 * s}px ${FONT}`; ctx.fillStyle = '#FFFDF6'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('GUM', x, y + 2 * s); ctx.textAlign = 'left'; }
// ---------- scenes ----------
GROUPS = [['hook', ['h1', 'h2', 'h3']], ['iklan', ['m1', 'm2', 'm3']], ['potong', ['m4', 'm5']], ['ganggu', ['m6', 'm7']], ['semua', ['m8', 'm9', 'm10']], ['nama', ['m11']],
  ['lawan', ['d1', 'd2', 'd3', 'd4']], ['ciri', ['p1', 'p2', 'p3', 'p4', 'p5', 'p6', 'p7']], ['brand', ['a1', 'a1b']], ['kenapa', ['p8', 'p9', 'p10']], ['riset', ['s1', 's2', 's3']], ['hasil', ['s4']],
  ['kunyah', ['s5', 's6']], ['teka', ['s7', 's8', 's9']], ['langkah', ['s10', 's11']], ['rangkum', ['r1']], ['cta', ['c1', 'c2', 'c3', 'c4']], ['akhir', ['z']]];
const age = id => T - t0(id);
function radio() { GAYA.shape(rr(-110, -60, 220, 130, 18), ACC, 3640, {}); GAYA.shape(ell(-50, 5, 38, 38, 20), GR, 3641, { hatch: false }); for (let i = 0; i < 3; i++) GAYA.line([[20, -20 + i * 22], [80, -20 + i * 22]], 3, '#2E2C2A', 3642 + i); GAYA.line([[60, -60], [100, -110]], 3, '#2E2C2A', 3646); }
S.hook = (t) => {
  shade(.16 * (1 - seg(t, t0('h3'), t0('h3') + .6))); GAYA.shape([[640, 470], [980, 470], [980, 800], [640, 800]], GR, 100, { gap: 14 }); ctx.fillStyle = `rgba(255,190,120,${.35 + .3 * seg(t, t0('h3'), t0('h3') + .6)})`; ctx.fillRect(644, 474, 332, 322);   // window, sunrise
  GAYA.shape([[-20, 1150], [1100, 1150], [1100, 1700], [-20, 1700]], GR, 101, { gap: 18 }); GAYA.shape([[60, 1060], [420, 1060], [440, 1160], [40, 1160]], GR, 102, { hatch: false });   // bed & pillow
  const angry = t > t0('h1') + 1.4, gumOn = t > t0('h3');
  clawd(360, 1150, 30, { face: gumOn ? 'curious' : angry ? 'squint' : 'sleepy', arms: angry && !gumOn ? [1.6, 1.6] : [.2, .2], mark: angry && !gumOn ? 'cloud' : null, markAge: t - t0('h1') - 1.4 });
  const out = seg(t, .3, 1.6); if (out > 0) { orbit(380, 880, 260, 90, t, angry ? 7 : 4, angry ? 1.2 : 1, angry ? 2.6 : 1.6); worm(lerp(380, 380 + Math.cos(t * 1.6) * 260, out), lerp(1020, 880 + Math.sin(t * 1.6) * 90, out), 1.6); }
  if (t > t0('h2') && !gumOn) { const a = t - t0('h2'); GAYA.shape(ell(840, 1000, 90, 90, 30), '#FFFDF6', 120, { text: true }); const an = -Math.PI / 2 + a * 2.5; GAYA.line([[840, 1000], [840 + Math.cos(an) * 70, 1000 + Math.sin(an) * 70]], 6, '#2E2C2A', 121); }
  if (gumOn) { const a = t - t0('h3'); mark('?', 820, 820, 40, a - .4); ctx.save(); ctx.translate(800, 1060); ctx.scale(backOut(seg(a, .3, .6)), backOut(seg(a, .3, .6))); GAYA.shape(rr(-110, -90, 220, 180, 16), ACC, 122, {}); ctx.font = `700 120px ${FONT}`; ctx.fillStyle = '#FFFDF6'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('?', 0, 6); ctx.textAlign = 'left'; ctx.restore(); mark('sparkle', 870, 940, 30, a - .5); }
  if (t < t0('h2')) tag('Bangun tidur, *lagu nyebelin* muter', 540, 330, 72, { age: t + .3 });
  else if (t < t0('h3')) tag('Seharian *nggak mau pergi*', 540, 330, 76, { age: t - t0('h2') });
  else tag('Obatnya ada. *Aneh banget.*', 540, 330, 76, { age: t - t0('h3') });
};

// IKLAN: a warung with a radio playing a jingle; then three little panels: shower, work, bed: the song keeps going
S.iklan = (t) => {
  if (t < t0('m3')) {
    GAYA.shape([[140, 560], [940, 560], [940, 1180], [140, 1180]], GR, 3700, { gap: 16 }); GAYA.shape([[100, 470], [980, 470], [940, 600], [140, 600]], ACC, 3701, {});
    ctx.font = `700 64px ${FONT}`; ctx.fillStyle = '#FFFDF6'; ctx.textAlign = 'center'; ctx.fillText('WARUNG', 540, 560); ctx.textAlign = 'left';
    for (let i = 0; i < 5; i++) GAYA.shape(rr(190 + i * 140, 700, 110, 160, 10), GR, 3702 + i, { hatch: false });
    ctx.save(); ctx.translate(800, 960); radio(); ctx.restore(); if (t > t0('m2')) orbit(800, 880, 140, 50, t, 4, .8, 2.4, 3710);
    clawd(330, 1250, 22, { face: t > t0('m2') + 1 ? 'curious' : 'neutral', mark: t > t0('m2') + 1.5 ? 'notes' : null, markAge: age('m2') - 1.5 });
    tag(t < t0('m2') ? 'Coba *ingat-ingat*...' : 'Lagu iklan di *warung*', 540, 330, 74, { age: t < t0('m2') ? age('m1') : age('m2') }); return; }
  const a = age('m3'), lbl = ['mandi', 'kerja', 'mau tidur'];
  lbl.forEach((s2, i) => { const k = backOut(seg(a, i * .9, i * .9 + .3)); if (k <= 0) return; const y = 420 + i * 330; ctx.save(); ctx.translate(540, y); ctx.scale(k, k);
    GAYA.shape(rr(-400, -140, 800, 280, 20), '#FFFDF6', 3720 + i, { text: true }); clawd(-220, 110, 11, { face: i === 2 ? 'sleepy' : 'squint' }); orbit(-220, -20, 110, 30, T, 3, .5, 2.5, 3730 + i * 10);
    ctx.font = `700 64px ${FONT}`; ctx.fillStyle = '#2E2C2A'; ctx.fillText(s2, -40, 22); ctx.restore(); });
};
S.potong = (t) => {
  const a = t - t0('m4'), sp = t * 3;   // cassette
  GAYA.shape(rr(190, 560, 700, 440, 30), GR, 3500, { gap: 14 }); GAYA.shape(rr(290, 640, 500, 170, 20), '#FFFDF6', 3501, { text: true });
  for (const x of [400, 680]) { GAYA.shape(ell(x, 725, 60, 60, 24), GR, 3502 + x, { hatch: false }); for (let i = 0; i < 6; i++) { const an = sp + i * TAU / 6; GAYA.line([[x, 725], [x + Math.cos(an) * 50, 725 + Math.sin(an) * 50]], 3, '#2E2C2A', 3510 + i); } }
  ctx.font = `700 120px ${FONT}`; ctx.fillStyle = ACC; ctx.textAlign = 'center'; ctx.save(); ctx.translate(540, 1170); ctx.rotate(t * 3); ctx.fillText('↻', 0, 40); ctx.restore(); ctx.textAlign = 'left';
  orbit(540, 400, 300, 50, t, 4, 1, 3);
};

// GANGGU: during an exam the song sings along; chatting with a friend, can't focus
S.ganggu = (t) => {
  if (t < t0('m7')) { GAYA.shape(rr(160, 820, 760, 420, 20), GR, 3800, { gap: 16 }); GAYA.shape(rr(300, 720, 480, 360, 10), '#FFFDF6', 3801, { text: true });
    ctx.font = `700 46px ${FONT}`; ctx.fillStyle = '#2E2C2A'; ctx.fillText('UJIAN', 470, 790); for (let i = 0; i < 5; i++) GAYA.line([[340, 850 + i * 44], [740, 850 + i * 44]], 2.5, GR, 3802 + i, .6);
    clawd(540, 700, 20, { face: 'squint', mark: 'notes', markAge: 1 }); worm(700 + Math.cos(T * 2) * 120, 480 + Math.sin(T * 2) * 30, 1.5);
    tag('Lagi ujian, *malah nyanyi*', 540, 300, 70, { age: age('m6') }); return; }
  clawd(340, 1200, 24, { face: 'curious', look: [1, 0] }); clawd(780, 1200, 24, { face: 'happy', flip: true, color: '#7FA6C9', dark: '#56789B' });
  GAYA.shape(rr(560, 700, 420, 140, 30), '#FFFDF6', 3810, { text: true }); for (let i = 0; i < 3; i++) GAYA.line([[600, 740 + i * 34], [930, 740 + i * 34]], 3, GR, 3811 + i, .6);
  orbit(340, 860, 160, 50, T, 4, .8, 2.6, 3820); tag('Lagi ngobrol, *nggak fokus*', 540, 300, 70, { age: age('m7') });
};
// SEMUA: 10 heads, 9 have a song looping: almost 9 out of 10, at least once a week
S.semua = (t) => {
  const a = age('m8');
  for (let i = 0; i < 10; i++) { const x = 220 + (i % 5) * 160, y = 620 + Math.floor(i / 5) * 280, on = t > t0('m9') + .5 + i * .1 && i !== 7; GAYA.shape(ell(x, y, 50, 50, 20), on ? ACC : GR, 3900 + i, { hatch: !on, lw: 2.4 }); GAYA.line([[x - 50, y + 130], [x, y + 60], [x + 50, y + 130]], 3, '#2E2C2A', 3920 + i);
    if (on) note(x + 20, y - 70, .6, 3940 + i * 2); }
  if (t > t0('m10')) { const k = backOut(seg(age('m10'), 0, .3)); ctx.save(); ctx.translate(540, 1240); ctx.scale(k, k); GAYA.shape(rr(-300, -70, 600, 140, 16), '#FFFDF6', 3960, { text: true }); ctx.font = `700 56px ${FONT}`; ctx.fillStyle = '#2E2C2A'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('seminggu sekali', 0, 4); ctx.textAlign = 'left'; ctx.restore(); }
  tag(t < t0('m9') ? 'Kamu *nggak sendirian*' : 'Hampir *9 dari 10* orang', 540, 330, 76, { age: t < t0('m9') ? a : age('m9') });
};
S.nama = (t) => {
 head(470, 820, 1.9); const a = t - t0('m11');
    ctx.save(); ctx.setLineDash([12, 12]); GAYA.line(ell(500, 700, 180, 90, 40).concat([[680, 700]]), 3, ACC, 3400, .8); ctx.restore();
    worm(500 + Math.cos(t * 2) * 180, 700 + Math.sin(t * 2) * 90, 1.8); orbit(500, 700, 180, 90, t + 1, 3, .8, 2);
    tag('*earworm*', 540, 1180, 96, { age: a - .5, rot: -.03 }); tag('= cacing telinga', 540, 1290, 56, { age: a - 1.2, bare: true });
};
S.lawan = (t) => {
  const a = t - t0('d1'), b = t - t0('d4'); GAYA.shape([[640, 520], [900, 520], [900, 1240], [640, 1240]], GR, 3600, { gap: 14 });
  const push = seg(a, .2, 1.6), back = seg(b, 0, .6), wx = lerp(lerp(500, 980, push), 360, back);
  worm(wx, 900 + Math.sin(t * 6) * 10, 2); orbit(wx, 900, 150, 70, t, 3, .8, 3);
  clawd(380, 1240, 26, { face: back > 0 ? 'squint' : 'worried', arms: back > 0 ? [1.6, 1.6] : [1.2, .2], mark: back > 0 ? '!' : 'sweat', markAge: back > 0 ? b : a });
  if (t > t0('d3') && back <= 0) { ctx.save(); ctx.translate(250, 700); GAYA.shape(rr(-110, -70, 220, 140, 16), GR, 3610, {}); ctx.restore(); orbit(250, 620, 120, 40, t, 3, .7, 3, 3620); }
  if (back > 0) tag('*Balik lagi!*', 540, 330, 90, { age: b, rot: -.03 }); else tag(t < t0('d2') ? 'Kita coba *melawan*' : t < t0('d3') ? 'Paksa diri *nggak mikirin*' : 'Setel lagu lain *biar ketimpa*', 540, 330, 66, { age: t < t0('d2') ? a : t < t0('d3') ? t - t0('d2') : t - t0('d3') });
};

// CIRI: 2016: 3,000 people asked; the stuck songs share traits: faster tempo, an easy rise-and-fall, an unusual leap, lots of radio play
S.ciri = (t) => {
  if (t < t0('p3')) { const a = age('p1');
    for (let i = 0; i < 60; i++) { const x = 150 + (i % 12) * 70, y = 560 + Math.floor(i / 12) * 110; if (t < t0('p2') + .2 + i * .01) continue; GAYA.shape(ell(x, y, 20, 20, 10), GR, 4000 + i, { hatch: false, lw: 2 }); }
    if (t > t0('p2')) { ctx.font = `700 130px ${FONT}`; ctx.fillStyle = ACC; ctx.textAlign = 'center'; ctx.fillText('3.000', 540, 1250); ctx.textAlign = 'left'; }
    tag(t < t0('p2') ? 'Kenapa *gampang nyangkut?*' : '*2016*: 3.000 orang ditanya', 540, 330, 70, { age: t < t0('p2') ? a : age('p2') }); return; }
  const cards = [['p4', 'tempo cepat'], ['p5', 'pola nada mudah'], ['p6', 'lompatan nada'], ['p7', 'sering di radio']];
  cards.forEach(([id, s2], i) => { if (t < t0(id) - .1) return; const k = backOut(seg(age(id), 0, .3)), x = 300 + (i % 2) * 480, y = 640 + Math.floor(i / 2) * 420;
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k); GAYA.shape(rr(-210, -170, 420, 340, 20), '#FFFDF6', 4100 + i, { text: true });
    if (i === 0) { const an = Math.sin(T * 9) * .6; GAYA.shape([[-60, 90], [60, 90], [25, -90], [-25, -90]], GR, 4110, {}); GAYA.line([[0, 70], [Math.sin(an) * 110, 70 - Math.cos(an) * 110]], 5, ACC, 4111); }
    if (i === 1) GAYA.line(Array.from({ length: 21 }, (_, j) => [-150 + j * 15, 40 - 100 * Math.sin(j / 20 * Math.PI)]), 6, ACC, 4112);
    if (i === 2) { GAYA.line([[-150, 60], [-60, 60], [-60, -80], [40, -80], [40, 20], [150, 20]], 6, ACC, 4113); }
    if (i === 3) { ctx.save(); ctx.translate(0, -10); ctx.scale(.9, .9); radio(); ctx.restore(); }
    ctx.font = `700 40px ${FONT}`; ctx.fillStyle = '#2E2C2A'; ctx.textAlign = 'center'; ctx.fillText(s2, 0, 140); ctx.textAlign = 'left'; ctx.restore(); });
  tag('Lagu nyangkut punya *ciri mirip*', 540, 300, 62, { age: age('p3') });
};
S.brand = (t) => {
  warm(.35); const st = t1('a1') - .15, bAge = t - st;
  clawd(540, 1260, 32, { face: t < st ? 'curious' : t < t0('a1b') ? 'happy' : 'laugh', arms: bAge > 0 && t < t0('a1b') + .3 ? [.6, 1.45] : [1.2, 1.2], dy: t > t0('a1b') ? -.5 * Math.abs(Math.sin(t * 9)) : 0 });
  if (bAge > -.1) brandStamp(540, 560, bAge, TL.duration);
  if (t > t0('a1b')) { const k = backOut(seg(t - t0('a1b'), .2, .5)); ctx.save(); ctx.translate(840, 920); ctx.scale(k, k); radio(); ctx.restore(); orbit(840, 860, 110, 40, t, 3, .6, 2.5, 3630); }
};
S.kenapa = (t) => {   // p8-p10: the inner voice sings
  head(470, 820, 1.9); const chew = false, a = t - t0('p8');
  ctx.save(); ctx.translate(510, 720); const k = chew ? .5 + .5 * Math.sin(t * 14) : .5 + .5 * Math.sin(t * 6);   // the little mouth inside
  GAYA.shape(ell(0, 0, 90, 20 + 40 * k, 20), ACC, 4100, { hatch: false }); ctx.restore();
  if (!chew) orbit(510, 720, 180, 80, t, 4, .9, 2); else { for (let i = 0; i < 4; i++) { const p = seg(a, 3.4 + i * .2, 4.4 + i * .2); note(400 + i * 80, lerp(650, 1100, easeIn(p)), .9, 4110 + i * 3); } gum(860, 1110, 1.4); }
  tag(t < t0('p9') ? 'Kenapa *susah diusir?*' : t < t0('p10') ? 'Mirip *bicara dalam hati*' : 'Ada *suara kecil* yang ikut nyanyi', 540, 330, 62, { age: t < t0('p9') ? a : t < t0('p10') ? t - t0('p9') : t - t0('p10') });
