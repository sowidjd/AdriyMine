<!doctype html>
<html>
<head><meta charset="utf-8"><title>Ngetik 3 paragraf, kirim wkwk</title>
<style>
@font-face { font-family: 'Fredoka'; src: url(../_bersama/fonts/fredoka-latin.woff2) format('woff2'); font-weight: 300 700; }
html,body{margin:0;background:#222}canvas{height:100vh;display:block;margin:auto}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../_bersama/dasar.js"></script>
<script>
// "Ngetik 3 paragraf, dihapus, kirim wkwk" — gaya MANGA PANELS: tinta hitam tegas, screentone titik, satu warna aksen (oranye Clawd + kuning sorot).
// Metafora: kata-kata yang "ditelan" panel demi panel; panggung + lampu sorot = spotlight effect.
const INK = '#141414', PAPERC = '#FBFAF6';
let TONE = null, TONE2 = null;
const GAYA = {
  ink: INK, hi: '#F5C542', card: '#FFFFFF',
  init() {   // screentone patterns (dot grids), drawn once
    const mk = (sp, r) => { const c = document.createElement('canvas'); c.width = c.height = sp; const q = c.getContext('2d'); q.fillStyle = 'rgba(20,20,20,0.85)'; q.beginPath(); q.arc(sp / 2, sp / 2, r, 0, TAU); q.fill(); return ctx.createPattern(c, 'repeat'); };
    TONE = mk(12, 2.2); TONE2 = mk(9, 2.6);
  },
  shape(pts, col, id, o = {}) {
    const p = pathOf(pts); ctx.fillStyle = rgba(col, o.fill ?? 1); ctx.fill(p);
    if (o.tone) { ctx.save(); ctx.clip(p); ctx.globalAlpha *= o.tone; ctx.fillStyle = TONE; ctx.fillRect(-3000, -3000, 6000, 6000); ctx.restore(); }
    if (o.line !== false) { ctx.strokeStyle = INK; ctx.lineWidth = o.lw ?? (o.text ? 4 : 5); ctx.lineJoin = 'round'; ctx.stroke(p); }
  },
  line(pts, lw, col = INK, id, alpha = 1) { ctx.strokeStyle = rgba(col, alpha); ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(pathOf(pts, false)); },
  bg() { ctx.fillStyle = PAPERC; ctx.fillRect(0, 0, W, H); },
  trans(k, drawPrev) {   // manga page cut: a diagonal slash sweeps across; the old panel stays beyond it
    const x = lerp(-700, W + 700, easeOut(k)), P = [[x, -100], [W + 900, -100], [W + 900, H + 100], [x - 700, H + 100]];
    ctx.save(); ctx.clip(pathOf(P)); drawPrev(); ctx.restore();
    GAYA.line([[x, -100], [x - 700, H + 100]], 14, INK, 1, 1);
  },
  post(t) {},
};
// ---------- manga helpers ----------
function tone(x, y, w, h, a = .25, pat = TONE) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = pat; ctx.fillRect(x, y, w, h); ctx.restore(); }
function panel(x, y, w, h, draw, o = {}) {   // a bordered panel; contents clipped
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.fillStyle = o.bg || '#FFFFFF'; ctx.fillRect(x, y, w, h); ctx.translate(x, y); draw(w, h); ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.strokeRect(x, y, w, h);
}
function focusLines(cx, cy, r0, n = 70, col = INK, a = .9, seed = 1) {   // manga "concentration lines"
  ctx.save(); ctx.fillStyle = rgba(col, a);
  for (let i = 0; i < n; i++) { const an = i / n * TAU + hash(i + seed) * .05, w = .006 + .012 * hash(i * 3 + seed), r1 = r0 + 60 * hash(i * 7 + seed + BOIL);
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(an) * r1, cy + Math.sin(an) * r1); ctx.lineTo(cx + Math.cos(an - w) * 1600, cy + Math.sin(an - w) * 1600); ctx.lineTo(cx + Math.cos(an + w) * 1600, cy + Math.sin(an + w) * 1600); ctx.fill(); }
  ctx.restore();
}
function speedLines(x, y, w, h, n = 30, a = .6) { ctx.save(); ctx.strokeStyle = rgba(INK, a); for (let i = 0; i < n; i++) { const yy = y + hash(i + BOIL * 31) * h, l = w * (.3 + .6 * hash(i * 5)); ctx.lineWidth = 1 + 3 * hash(i * 3); ctx.beginPath(); ctx.moveTo(x + w - l, yy); ctx.lineTo(x + w, yy); ctx.stroke(); } ctx.restore(); }
function sfxWord(str, x, y, size, rot = 0, age = 1, col = '#FFFFFF') {   // hand-lettered sound effect (onomatopoeia) with thick outline
  const k = backOut(seg(age, 0, .2)); if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k); ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .18; ctx.strokeStyle = INK; ctx.strokeText(str, 0, 0); ctx.fillStyle = col; ctx.fillText(str, 0, 0); ctx.restore();
}
function bubble(x, y, w, h, tailX, tailY, o = {}) {   // speech/chat bubble
  const P = rr(x - w / 2, y - h / 2, w, h, Math.min(40, h / 2)); GAYA.shape(P, o.bg || '#FFFFFF', 600, { text: true, lw: 5 });
  if (tailX != null) { ctx.fillStyle = o.bg || '#FFFFFF'; ctx.beginPath(); ctx.moveTo(x - 30, y + h / 2 - 3); ctx.lineTo(tailX, tailY); ctx.lineTo(x + 20, y + h / 2 - 3); ctx.fill(); GAYA.line([[x - 30, y + h / 2], [tailX, tailY], [x + 20, y + h / 2]], 5, INK, 601); }
}
function phone(x, y, s, draw, o = {}) {   // a big phone; draw(w,h) paints the screen
  const w = 470 * s, h = 900 * s;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0);
  GAYA.shape(rr(-w / 2 - 22 * s, -h / 2 - 40 * s, w + 44 * s, h + 80 * s, 50 * s), '#2B2B2E', 700, {});
  ctx.save(); ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip(); ctx.translate(-w / 2, -h / 2); ctx.fillStyle = o.screen || '#F4F6F8'; ctx.fillRect(0, 0, w, h); draw(w, h); ctx.restore();
  ctx.restore();
}
function textLines(x, y, w, n, gap = 34, prog = 1) {   // grey "typed text" bars, n lines, revealed by prog (0..1)
  const tot = n * w; let rem = prog * tot;
  for (let i = 0; i < n && rem > 0; i++) { const lw = (i === n - 1 ? .55 : .85 + .15 * hash(i)) * w, d = Math.min(lw, rem); rem -= lw; ctx.fillStyle = '#5E6670'; ctx.fillRect(x, y + i * gap, d, 14); }
}
function person(x, y, s, o = {}) {   // a simple manga crowd figure (head + shoulders), facing us; o.look: eyes on Clawd
  GAYA.shape(rr(x - 45 * s, y, 90 * s, 90 * s, 30 * s), o.shirt || '#D9D9D9', 610, { tone: o.tone ?? .5, lw: 4 });
  GAYA.shape(ell(x, y - 30 * s, 34 * s, 38 * s, 20), '#FFFFFF', 611, { lw: 4 });
  ctx.fillStyle = INK; ctx.fillRect(x - 34 * s, y - 70 * s, 68 * s, 22 * s);
  const ex = o.look ? 8 * s : 0; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(x + sx * 12 * s + ex, y - 30 * s, 4.5 * s, 0, TAU); ctx.fill(); }
}
function room(t, night) {   // bedroom: dark blue night with phone glow
  ctx.fillStyle = mixh('#F2EFE8', '#1E2433', night); ctx.fillRect(0, 0, W, H); tone(0, 0, W, H, .18 + .25 * night);
  GAYA.shape([[620, 260], [960, 260], [960, 640], [620, 640]], mixh('#CFE6F5', '#2E3D5C', night), 620, { lw: 6 });   // window
  GAYA.line([[790, 260], [790, 640]], 6, INK, 621); GAYA.line([[620, 450], [960, 450]], 6, INK, 622);
  if (night > .5) { ctx.fillStyle = '#F5EBC8'; ctx.beginPath(); ctx.arc(880, 330, 34, 0, TAU); ctx.fill(); ctx.fillStyle = mixh('#CFE6F5', '#2E3D5C', night); ctx.beginPath(); ctx.arc(866, 320, 30, 0, TAU); ctx.fill(); }
  GAYA.shape([[-20, 1180], [1100, 1180], [1100, 1960], [-20, 1960]], mixh('#E9D9C2', '#2A2F3D', night), 623, { tone: .5 });   // bed
  GAYA.shape([[60, 1100], [430, 1100], [450, 1200], [40, 1200]], '#FFFFFF', 624, { tone: .2 });   // pillow
  GAYA.line([[120, 1560], [260, 1500], [330, 1580], [460, 1520]], 5, INK, 625);   // tangled charger cable
}
// ---------- scenes ----------
GROUPS = [['hook', ['h1', 'h2', 'h3']], ['ulang', ['k1', 'k1b']], ['panggung', ['k2', 'e1']], ['riset', ['e2', 'e3']], ['brand', ['a1', 'a1b', 'e4']], ['lega', ['e5']],
  ['trik', ['s1', 's2']], ['cta', ['c1', 'c2']], ['akhir', ['z']]];
// HOOK (0-8 s): the delete key is being hammered -> a big STOP; then the payoff up front: "you think 50%... actually 1 in 5"; then "there's research"
S.hook = (t) => {
  ctx.fillStyle = '#1E2433'; ctx.fillRect(0, 0, W, H); tone(0, 0, W, H, .35);
  const stop = t > .9, a2 = t - t0('h2'), a3 = t - t0('h3');
  if (t < t0('h2')) {
    const left = stop ? 6 : Math.max(1, Math.round(10 - t * 5));
    phone(540, 900, .9, (w, h) => { ctx.fillStyle = '#DDE3EA'; ctx.fillRect(0, 0, w, 86); ctx.fillStyle = INK; ctx.font = `700 34px ${FONT}`; ctx.fillText('Doi', 86, 56); GAYA.shape(ell(46, 44, 24, 24, 16), C.clay, 701, { lw: 3 });
      GAYA.shape(rr(20, h - 470, w - 40, 420, 26), '#FFFFFF', 702, { lw: 4 }); textLines(44, h - 440, w - 90, left, 38, 1);
      GAYA.shape(rr(w - 210, h - 40 - 0, 180, 0.1, 2), '#FFFFFF', 703, { line: false }); });
    if (!stop) speedLines(0, 1300, W, 200, 20, .5);
    clawd(830, 1340, 20, { face: stop ? 'shock' : 'worried', arms: [.2, stop ? 1.5 : 1.1 + .3 * Math.sin(t * 30)], mark: stop ? '!' : 'sweat', markAge: stop ? t - .9 : t });
    if (stop) { const k = backOut(seg(t, .9, 1.15)); ctx.save(); ctx.translate(540, 760); ctx.scale(k, k); ctx.rotate(-.08); GAYA.shape(ell(0, 0, 230, 230, 8, Math.PI / 8), C.red, 730, { lw: 8 }); sfxWord('STOP', 0, 10, 150, 0, 1, '#FFFFFF'); ctx.restore(); }
    tag('Berhenti hapus chat *3 paragraf!*', 540, 300, 76, { age: t + .2, rot: -.02 });
  } else {
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); focusLines(540, 860, 420, 60, INK, .1, 4);
    const real = t > t0('h2') + 2.3;   // "Padahal, cuma sekitar satu dari lima"
    for (let i = 0; i < 10; i++) { const x = 140 + (i % 5) * 200, y = 760 + Math.floor(i / 5) * 230, look = real ? (i === 2 || i === 6) : (i % 2 === 0); person(x, y, 1.25, { tone: look ? .15 : .55, look });   // 10 people: guess 5 look, really 2
      if (look) { GAYA.shape(ell(x, y - 120, 28, 18, 16), '#FFFFFF', 740 + i, { lw: 4 }); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x + 4, y - 120, 9, 0, TAU); ctx.fill(); } }
    ctx.font = `700 150px ${FONT}`; ctx.textAlign = 'center'; ctx.fillStyle = real ? '#B8BEC6' : C.red; ctx.fillText('50%', 300, 1200);
    if (real) { const k = backOut(seg(a2, 2.3, 2.6)); ctx.save(); ctx.translate(760, 1200); ctx.scale(k, k); ctx.fillStyle = C.red; ctx.font = `700 130px ${FONT}`; ctx.fillText('1/5', 0, 0); ctx.restore(); GAYA.line([[180, 1170], [420, 1110]], 12, C.red, 741, 1); }
    ctx.textAlign = 'left';
    tag(real ? 'Aslinya cuma *1 dari 5*' : 'Kamu ngira *separuh* lihat', 540, 300, 76, { age: real ? a2 - 2.3 : a2, rot: .02 });
    if (a3 > 0) { const k = backOut(seg(a3, .1, .35)); ctx.save(); ctx.translate(540, 520); ctx.rotate(-.06); ctx.scale(k, k); GAYA.shape(rr(-330, -70, 660, 140, 14), '#FFE14D', 750, { lw: 6 }); ctx.font = `700 70px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('ADA PENELITIANNYA', 0, 4); ctx.textAlign = 'left'; ctx.restore(); }
    clawd(540, 1380, 14, { face: a3 > 0 ? 'happy' : real ? 'shock' : 'curious', mark: a3 > 0 ? 'idea' : null, markAge: a3 });
  }
};
// ULANG: night, phone glow. Typing fills the draft, everything is deleted, "wkwk" is sent.
S.ulang = (t) => {
  room(t, 1);
  const glow = ctx.createRadialGradient(540, 820, 0, 540, 820, 700); glow.addColorStop(0, 'rgba(190,225,255,0.45)'); glow.addColorStop(1, 'rgba(190,225,255,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const typing = seg(t, t0('k1') - .3, t0('k1') + 2), del = seg(t, t0('k1') + 2.6, t1('k1') - .1), sent = t > t0('k1b') + .9;
  phone(540, 860, .95, (w, h) => {
    ctx.fillStyle = '#DDE3EA'; ctx.fillRect(0, 0, w, 90); ctx.fillStyle = INK; ctx.font = `700 34px ${FONT}`; ctx.fillText('Doi', 90, 58); GAYA.shape(ell(50, 46, 26, 26, 16), C.clay, 701, { lw: 3 });
    bubble(150, 170, 220, 70, null, null, { bg: '#FFFFFF' }); ctx.fillStyle = INK; ctx.font = `500 30px ${FONT}`; ctx.fillText('lagi apa?', 82, 180);
    if (sent) { const a = t - t0('k1b') - .9, k = backOut(seg(a, 0, .3)); ctx.save(); ctx.translate(w - 130, 290); ctx.scale(k, k); bubble(0, 0, 170, 76, null, null, { bg: '#FFD98A' }); ctx.font = `700 40px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('wkwk', 0, 2); ctx.restore(); }
    // draft box grows with typing, then shrinks while deleting
    const n = Math.max(0, Math.round(lerp(0, 9, typing) * (1 - del))), bh = sent ? 70 : 70 + n * 36;
    GAYA.shape(rr(20, h - bh - 30, w - 120, bh, 26), '#FFFFFF', 702, { lw: 4 }); if (!sent) textLines(44, h - bh - 4, w - 170, Math.max(1, n), 36, n ? 1 : 0);
    GAYA.shape(ell(w - 55, h - 65, 36, 36, 18), sent ? '#4F7FB8' : '#9AA3AD', 703, { lw: 3 });
  });
  const wink = t > (t1('k1b') + .2);
  clawd(900, 1330, 18, { face: t < t0('k1') + 2.6 ? 'curious' : t < t0('k1b') ? 'worried' : wink ? 'happy' : 'sad', arms: [.2, 1.2], mark: t > t0('k1') + 2.6 && t < t0('k1b') ? 'sweat' : wink ? 'idea' : null, markAge: wink ? t - (t1('k1b') + .2) : t - t0('k1') - 2.6, dy: -.3 * Math.abs(Math.sin(t * 6)) * (wink ? 1 : 0) });
  if (t > t0('k1') + 2.6 && t < t0('k1b')) sfxWord('HAPUS!', 260, 1180, 90, -.15, t - t0('k1') - 2.6, '#FFFFFF');
  if (t < t0('k1b') + .6) tag('Ngetik *panjang*...', 540, 300, 84, { age: t - t0('k1') + .2, rot: -.02 });
  else tag('...yang dikirim *wkwk*', 540, 300, 84, { age: t - t0('k1b') - .6, rot: .02 });
};
// JURI: three judges hold up score cards above Clawd's head
S.juri = (t) => {
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); focusLines(540, 1120, 330, 60, INK, .12, 3);
  const cards = ['LEBAY?', 'KEPANJANGAN?', 'ILFIL?'];
  cards.forEach((s, i) => { const a = t - t0('k2') - i * .75 - .2, up = backOut(seg(a, 0, .3)), x = 220 + i * 320;
    panel(x - 140, 300, 280, 360, (w, h) => { tone(0, 0, w, h, .35); person(w / 2, 220, 1.4, { tone: .8, shirt: '#3A3A3A' }); });
    if (up > 0) { ctx.save(); ctx.translate(x, 740); ctx.scale(up, up); ctx.rotate((i - 1) * .08); GAYA.shape(rr(-150, -60, 300, 120, 14), '#FFFFFF', 630 + i, { lw: 5 }); ctx.font = `700 ${s.length > 8 ? 38 : 52}px ${FONT}`; ctx.fillStyle = C.red; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 2); ctx.restore(); } });
  if (t < t0('k2')) tag('Otak jadi *juri*', 540, 930, 70, { age: t - t0('k1') - .3 });
  clawd(540, 1290, 30, { face: t > t0('k2') ? 'worried' : 'curious', phone: true, arms: [.9, .2], mark: t > t0('k2') + 1 ? 'sweat' : null, markAge: t - t0('k2') - 1, dx: 0, rot: Math.sin(t * 20) * .02 * seg(t, t0('k2'), t0('k2') + .5) });
};
// PANGGUNG: dark stage, one spotlight on Clawd, an audience of eyes; then the name of the effect
S.panggung = (t) => {
  const dark = ease(seg(t, t0('k2') - .2, t0('k2') + .6)), title = t > t0('e1');
  ctx.fillStyle = mixh('#FFFFFF', '#121418', dark); ctx.fillRect(0, 0, W, H); tone(0, 0, W, H, .25 * dark, TONE2);
  for (const s of [-1, 1]) GAYA.shape([[540 + s * 560, 200], [540 + s * 330, 200], [540 + s * 380, 1300], [540 + s * 560, 1300]], '#7A1E1E', 640 + s, { tone: .45 });   // curtains
  GAYA.shape([[-20, 1180], [1100, 1180], [1100, 1400], [-20, 1400]], '#6B4A2E', 642, { tone: .3 });   // stage boards
  const on = seg(t, t0('k2') + .7, t0('k2') + .8);
  if (on > 0) { ctx.save(); ctx.globalAlpha = on; const g = ctx.createLinearGradient(0, 200, 0, 1200); g.addColorStop(0, 'rgba(255,240,180,0.15)'); g.addColorStop(1, 'rgba(255,240,180,0.6)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(500, 200); ctx.lineTo(580, 200); ctx.lineTo(780, 1220); ctx.lineTo(300, 1220); ctx.fill(); ctx.fillStyle = 'rgba(255,240,180,0.55)'; ctx.beginPath(); ctx.ellipse(540, 1220, 240, 40, 0, 0, TAU); ctx.fill(); ctx.restore(); }
  clawd(540, 1210, 28, { face: on > 0 ? 'shock' : 'curious', phone: true, arms: [.9, .3], sq: on > 0 ? .06 * Math.exp(-(t - t0('k2') - .7) * 4) : 0, mark: on > 0 ? '!' : null, markAge: t - t0('k2') - .8 });
  for (let i = 0; i < 14 && dark > .3; i++) { const x = 60 + i * 74, y = 1345 + 30 * hash(i), blink = hash(Math.floor(t * 2) + i) > .93;   // audience heads with glowing eyes
    ctx.fillStyle = '#05060A'; ctx.beginPath(); ctx.ellipse(x, y, 40, 46, 0, 0, TAU); ctx.fill(); if (!blink && on > 0) { ctx.fillStyle = '#FFFFFF'; for (const s of [-1, 1]) { ctx.beginPath(); ctx.ellipse(x + s * 13, y - 8, 8, 6, 0, 0, TAU); ctx.fill(); } } }
  if (title) { const a = t - t0('e1'); ctx.save(); ctx.globalAlpha = seg(a, 0, .2); focusLines(540, 520, 250, 80, '#FFFFFF', .55, 7); ctx.restore();
    sfxWord('SPOTLIGHT', 540, 450, 120, -.05, a, '#F5C542'); sfxWord('EFFECT', 540, 580, 120, -.05, a - .15, '#F5C542'); tag('efek lampu sorot', 540, 720, 50, { age: a - 1.2 }); }
};
// RISET: daylight classroom; Clawd walks in wearing an embarrassing shirt; guess: half the room is staring
S.riset = (t) => {
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  GAYA.shape([[60, 260], [1020, 260], [1020, 520], [60, 520]], '#E8EEF2', 650, { tone: .15 });   // board
  ctx.fillStyle = INK; ctx.font = `700 46px ${FONT}`; ctx.fillText('PENELITIAN', 100, 330); ctx.font = `500 40px ${FONT}`; ctx.fillText('Cornell University, 2000', 100, 400); ctx.fillText('(Gilovich dkk.)', 100, 460);
  GAYA.shape([[820, 560], [980, 560], [980, 1000], [820, 1000]], '#C9A27A', 651, { tone: .3 });   // door
  const walk = seg(t, t0('e2') + 1.2, t0('e2') + 3.5), cx = lerp(900, 640, walk);
  const guess = t > t0('e3');
  const seats = []; for (let r = 0; r < 2; r++) for (let q = 0; q < 5; q++) seats.push([140 + q * 190, 1110 + r * 160, r * 5 + q]);
  seats.forEach(([x, y, i]) => { if (!guess || i % 2) person(x, y, 1.1, { tone: .4 }); });
  clawd(cx, 1000, 18, { face: walk < 1 ? 'curious' : 'worried', walk: walk > 0 && walk < 1 ? t * 10 : 0, blush: walk > .3, arms: [.2, .2] });
  // the embarrassing shirt print: a goofy duck on Clawd's body
  ctx.save(); ctx.translate(cx, 1000 - 5 * 18); GAYA.shape(ell(0, 0, 34, 28, 16), '#FFE14D', 652, { lw: 3 }); GAYA.shape([[28, -2], [52, 4], [28, 10]], '#F08A2B', 653, { lw: 3 }); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(12, -8, 4, 0, TAU); ctx.fill(); ctx.restore();
  if (t < t0('e3')) tag('Pakai *kaos memalukan*', 480, 640, 62, { age: t - t0('e2') - .4 });
  if (guess) { const a = t - t0('e3');
    seats.forEach(([x, y, i]) => { if (i % 2 === 0) { person(x, y, 1.1, { tone: .4, look: true }); if (a > .3 + i * .05) { ctx.save(); ctx.translate(x, y - 95); ctx.scale(backOut(seg(a, .3 + i * .05, .6 + i * .05)), 1); GAYA.shape(ell(0, 0, 30, 18, 16), '#FFFFFF', 660 + i, { lw: 3 }); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(4, 0, 9, 0, TAU); ctx.fill(); ctx.restore(); } } });
    bubble(420, 700, 330, 140, 560, 860, { bg: '#FFFFFF' }); ctx.font = `700 76px ${FONT}`; ctx.fillStyle = C.red; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('50%?', 420, 704); ctx.textAlign = 'left';
  }
};
// BRAND + reveal: warm stamp moment, then only 1 of 5 really noticed
S.brand = (t) => {
  ctx.fillStyle = '#FFF4DF'; ctx.fillRect(0, 0, W, H); tone(0, 0, W, H, .08);
  if (t < t0('e4')) { const st = t1('a1') - .15, bAge = t - st;
