<!doctype html>
<html>
<head><meta charset="utf-8"><title>Ngetik 3 paragraf, kirim wkwk</title>
<style>
@font-face { font-family: 'Fredoka'; src: url(../_bersama/fonts/fredoka-latin.woff2) format('woff2'); font-weight: 300 700; }
html,body{margin:0;background:#222}canvas{height:100vh;display:block;margin:auto}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../_bersama/dasar.js"></script>
<script>
// "Ngetik 3 paragraf, dihapus, kirim wkwk" — gaya MANGA PANELS: tinta hitam tegas, screentone titik, satu warna aksen (oranye Clawd + kuning sorot).
// Metafora: kata-kata yang "ditelan" panel demi panel; panggung + lampu sorot = spotlight effect.
const INK = '#141414', PAPERC = '#FBFAF6';
let TONE = null, TONE2 = null;
const GAYA = {
  ink: INK, hi: '#F5C542', card: '#FFFFFF',
  init() {   // screentone patterns (dot grids), drawn once
    const mk = (sp, r) => { const c = document.createElement('canvas'); c.width = c.height = sp; const q = c.getContext('2d'); q.fillStyle = 'rgba(20,20,20,0.85)'; q.beginPath(); q.arc(sp / 2, sp / 2, r, 0, TAU); q.fill(); return ctx.createPattern(c, 'repeat'); };
    TONE = mk(12, 2.2); TONE2 = mk(9, 2.6);
  },
  shape(pts, col, id, o = {}) {
    const p = pathOf(pts); ctx.fillStyle = rgba(col, o.fill ?? 1); ctx.fill(p);
    if (o.tone) { ctx.save(); ctx.clip(p); ctx.globalAlpha *= o.tone; ctx.fillStyle = TONE; ctx.fillRect(-3000, -3000, 6000, 6000); ctx.restore(); }
    if (o.line !== false) { ctx.strokeStyle = INK; ctx.lineWidth = o.lw ?? (o.text ? 4 : 5); ctx.lineJoin = 'round'; ctx.stroke(p); }
  },
  line(pts, lw, col = INK, id, alpha = 1) { ctx.strokeStyle = rgba(col, alpha); ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(pathOf(pts, false)); },
  bg() { ctx.fillStyle = PAPERC; ctx.fillRect(0, 0, W, H); },
  trans(k, drawPrev) {   // manga page cut: a diagonal slash sweeps across; the old panel stays beyond it
    const x = lerp(-700, W + 700, easeOut(k)), P = [[x, -100], [W + 900, -100], [W + 900, H + 100], [x - 700, H + 100]];
    ctx.save(); ctx.clip(pathOf(P)); drawPrev(); ctx.restore();
    GAYA.line([[x, -100], [x - 700, H + 100]], 14, INK, 1, 1);
  },
  post(t) {},
};
// ---------- manga helpers ----------
function tone(x, y, w, h, a = .25, pat = TONE) { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = pat; ctx.fillRect(x, y, w, h); ctx.restore(); }
function panel(x, y, w, h, draw, o = {}) {   // a bordered panel; contents clipped
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); ctx.fillStyle = o.bg || '#FFFFFF'; ctx.fillRect(x, y, w, h); ctx.translate(x, y); draw(w, h); ctx.restore();
  ctx.strokeStyle = INK; ctx.lineWidth = 7; ctx.strokeRect(x, y, w, h);
}
function focusLines(cx, cy, r0, n = 70, col = INK, a = .9, seed = 1) {   // manga "concentration lines"
  ctx.save(); ctx.fillStyle = rgba(col, a);
  for (let i = 0; i < n; i++) { const an = i / n * TAU + hash(i + seed) * .05, w = .006 + .012 * hash(i * 3 + seed), r1 = r0 + 60 * hash(i * 7 + seed + BOIL);
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(an) * r1, cy + Math.sin(an) * r1); ctx.lineTo(cx + Math.cos(an - w) * 1600, cy + Math.sin(an - w) * 1600); ctx.lineTo(cx + Math.cos(an + w) * 1600, cy + Math.sin(an + w) * 1600); ctx.fill(); }
  ctx.restore();
}
function speedLines(x, y, w, h, n = 30, a = .6) { ctx.save(); ctx.strokeStyle = rgba(INK, a); for (let i = 0; i < n; i++) { const yy = y + hash(i + BOIL * 31) * h, l = w * (.3 + .6 * hash(i * 5)); ctx.lineWidth = 1 + 3 * hash(i * 3); ctx.beginPath(); ctx.moveTo(x + w - l, yy); ctx.lineTo(x + w, yy); ctx.stroke(); } ctx.restore(); }
function sfxWord(str, x, y, size, rot = 0, age = 1, col = '#FFFFFF') {   // hand-lettered sound effect (onomatopoeia) with thick outline
  const k = backOut(seg(age, 0, .2)); if (k <= 0) return;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k); ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * .18; ctx.strokeStyle = INK; ctx.strokeText(str, 0, 0); ctx.fillStyle = col; ctx.fillText(str, 0, 0); ctx.restore();
}
function bubble(x, y, w, h, tailX, tailY, o = {}) {   // speech/chat bubble
  const P = rr(x - w / 2, y - h / 2, w, h, Math.min(40, h / 2)); GAYA.shape(P, o.bg || '#FFFFFF', 600, { text: true, lw: 5 });
  if (tailX != null) { ctx.fillStyle = o.bg || '#FFFFFF'; ctx.beginPath(); ctx.moveTo(x - 30, y + h / 2 - 3); ctx.lineTo(tailX, tailY); ctx.lineTo(x + 20, y + h / 2 - 3); ctx.fill(); GAYA.line([[x - 30, y + h / 2], [tailX, tailY], [x + 20, y + h / 2]], 5, INK, 601); }
}
function phone(x, y, s, draw, o = {}) {   // a big phone; draw(w,h) paints the screen
  const w = 470 * s, h = 900 * s;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0);
  GAYA.shape(rr(-w / 2 - 22 * s, -h / 2 - 40 * s, w + 44 * s, h + 80 * s, 50 * s), '#2B2B2E', 700, {});
  ctx.save(); ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip(); ctx.translate(-w / 2, -h / 2); ctx.fillStyle = o.screen || '#F4F6F8'; ctx.fillRect(0, 0, w, h); draw(w, h); ctx.restore();
  ctx.restore();
}
function textLines(x, y, w, n, gap = 34, prog = 1) {   // grey "typed text" bars, n lines, revealed by prog (0..1)
  const tot = n * w; let rem = prog * tot;
  for (let i = 0; i < n && rem > 0; i++) { const lw = (i === n - 1 ? .55 : .85 + .15 * hash(i)) * w, d = Math.min(lw, rem); rem -= lw; ctx.fillStyle = '#5E6670'; ctx.fillRect(x, y + i * gap, d, 14); }
}
function person(x, y, s, o = {}) {   // a simple manga crowd figure (head + shoulders), facing us; o.look: eyes on Clawd
  GAYA.shape(rr(x - 45 * s, y, 90 * s, 90 * s, 30 * s), o.shirt || '#D9D9D9', 610, { tone: o.tone ?? .5, lw: 4 });
  GAYA.shape(ell(x, y - 30 * s, 34 * s, 38 * s, 20), '#FFFFFF', 611, { lw: 4 });
  ctx.fillStyle = INK; ctx.fillRect(x - 34 * s, y - 70 * s, 68 * s, 22 * s);
  const ex = o.look ? 8 * s : 0; for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(x + sx * 12 * s + ex, y - 30 * s, 4.5 * s, 0, TAU); ctx.fill(); }
}
function room(t, night) {   // bedroom: dark blue night with phone glow
  ctx.fillStyle = mixh('#F2EFE8', '#1E2433', night); ctx.fillRect(0, 0, W, H); tone(0, 0, W, H, .18 + .25 * night);
  GAYA.shape([[620, 260], [960, 260], [960, 640], [620, 640]], mixh('#CFE6F5', '#2E3D5C', night), 620, { lw: 6 });   // window
  GAYA.line([[790, 260], [790, 640]], 6, INK, 621); GAYA.line([[620, 450], [960, 450]], 6, INK, 622);
  if (night > .5) { ctx.fillStyle = '#F5EBC8'; ctx.beginPath(); ctx.arc(880, 330, 34, 0, TAU); ctx.fill(); ctx.fillStyle = mixh('#CFE6F5', '#2E3D5C', night); ctx.beginPath(); ctx.arc(866, 320, 30, 0, TAU); ctx.fill(); }
  GAYA.shape([[-20, 1180], [1100, 1180], [1100, 1960], [-20, 1960]], mixh('#E9D9C2', '#2A2F3D', night), 623, { tone: .5 });   // bed
  GAYA.shape([[60, 1100], [430, 1100], [450, 1200], [40, 1200]], '#FFFFFF', 624, { tone: .2 });   // pillow
  GAYA.line([[120, 1560], [260, 1500], [330, 1580], [460, 1520]], 5, INK, 625);   // tangled charger cable
}
// ---------- scenes ----------
GROUPS = [['hook', ['h1', 'h2', 'h3']], ['malam', ['m1', 'm2', 'm3']], ['juri', ['m4', 'm5']], ['hapus', ['m6', 'm7']], ['grup', ['m8', 'm9', 'm10', 'm11']],
  ['kaca', ['m12', 'm13']], ['dugaan', ['d1', 'd2', 'd3', 'd4', 'd5']], ['panggung', ['p1', 'p2']], ['riset', ['p3', 'p4', 'p5', 'p6', 'p7']], ['brand', ['a1', 'a1b', 'p8']],
  ['dalam', ['p9', 'p10', 'p11', 'p12']], ['gugup', ['p13', 'p14']], ['langkah1', ['s1', 's2', 's3']], ['langkah2', ['s4', 's5', 's6']], ['langkah3', ['s7', 's8']],
  ['rangkum', ['r1']], ['cta', ['c1', 'c2', 'c3', 'c4']], ['akhir', ['z']]];
const age = id => T - t0(id);
function chatPhone(t, o) {   // the gebetan chat: o.lines (draft lines), o.sent (show "wkwk" bubble from age), o.glow
  phone(540, 860, .92, (w, h) => {
    ctx.fillStyle = '#DDE3EA'; ctx.fillRect(0, 0, w, 86); ctx.fillStyle = INK; ctx.font = `700 34px ${FONT}`; ctx.fillText('Gebetan', 86, 56); GAYA.shape(ell(46, 44, 24, 24, 16), '#E58FA6', 701, { lw: 3 });
    bubble(150, 170, 230, 70, null, null, {}); ctx.fillStyle = INK; ctx.font = `500 30px ${FONT}`; ctx.fillText('lagi apa?', 78, 180);
    if (o.sent != null && o.sent > 0) { const k = backOut(seg(o.sent, 0, .3)); ctx.save(); ctx.translate(w - 130, 300); ctx.scale(k, k); bubble(0, 0, 170, 76, null, null, { bg: '#FFD98A' }); ctx.font = `700 40px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('wkwk', 0, 2); ctx.restore(); }
    const n = Math.max(0, Math.round(o.lines)), bh = 70 + n * 36;
    GAYA.shape(rr(20, h - bh - 30, w - 120, bh, 26), '#FFFFFF', 702, { lw: 4 }); if (n) textLines(44, h - bh - 4, w - 170, n, 36, 1);
    GAYA.shape(ell(w - 55, h - 65, 36, 36, 18), o.sentBtn ? '#4F7FB8' : '#9AA3AD', 703, { lw: 3 });
  });
}
// HOOK: the delete key is hammered -> STOP; "there's a reason" (question marks); "and it's NOT because you're lebay"
S.hook = (t) => {
  ctx.fillStyle = '#1E2433'; ctx.fillRect(0, 0, W, H); tone(0, 0, W, H, .35);
  const stop = t > .9;
  if (t < t0('h2')) {
    chatPhone(t, { lines: stop ? 6 : Math.max(1, 10 - t * 5) });
    if (!stop) speedLines(0, 1300, W, 200, 20, .5);
    clawd(830, 1340, 20, { face: stop ? 'shock' : 'worried', arms: [.2, stop ? 1.5 : 1.1 + .3 * Math.sin(t * 30)], mark: stop ? '!' : 'sweat', markAge: stop ? t - .9 : t });
    if (stop) { const k = backOut(seg(t, .9, 1.15)); ctx.save(); ctx.translate(540, 760); ctx.scale(k, k); ctx.rotate(-.08); GAYA.shape(ell(0, 0, 230, 230, 8, Math.PI / 8), C.red, 730, { lw: 8 }); sfxWord('STOP', 0, 10, 150, 0, 1, '#FFFFFF'); ctx.restore(); }
    tag('Berhenti hapus pesan *3 paragraf!*', 540, 300, 74, { age: t + .2, rot: -.02 });
    return; }
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); focusLines(540, 900, 380, 60, INK, .12, 4);
  for (let i = 0; i < 6; i++) { const a = T * 1.4 + i; mark('?', 540 + Math.cos(a) * 330, 860 + Math.sin(a) * 260, 20, age('h2') - i * .12); }
  clawd(540, 1250, 30, { face: t > t0('h3') ? 'happy' : 'worried', arms: [.4, .4], phone: true, mark: t > t0('h3') ? 'idea' : 'sweat', markAge: t > t0('h3') ? age('h3') : age('h2') });
  if (t < t0('h3')) tag('Ada *alasannya*...', 540, 300, 90, { age: age('h2') });
  else { tag('...bukan karena *LEBAY*', 540, 300, 84, { age: age('h3') }); const s2 = seg(age('h3'), 1.2, 1.5); if (s2 > 0) GAYA.line([[560, 330], [lerp(560, 860, s2), lerp(330, 270, s2)]], 12, C.red, 731, 1); }
};
// MALAM: night bedroom, a long reply being typed to the crush
S.malam = (t) => {
  room(t, 1); const glow = ctx.createRadialGradient(540, 820, 0, 540, 820, 700); glow.addColorStop(0, 'rgba(190,225,255,0.45)'); glow.addColorStop(1, 'rgba(190,225,255,0)'); ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  chatPhone(t, { lines: lerp(0, 9, seg(t, t0('m3') - .2, t1('m3') + .5)) });
  clawd(900, 1330, 18, { face: t > t0('m3') ? 'happy' : 'curious', arms: [.2, 1.1 + .25 * Math.sin(t * 24) * (t > t0('m3') ? 1 : 0)], blush: t > t0('m2') + 1.5 });
  if (t < t0('m2')) tag('Coba *ingat-ingat*...', 540, 300, 80, { age: age('m1') + .2 });
  else tag('Balas pesan *gebetan*', 540, 300, 80, { age: age('m2') });
};
// JURI: the brain turns into three judges holding score cards
S.juri = (t) => {
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); focusLines(540, 1120, 330, 60, INK, .12, 3);
  const cards = ['KEPANJANGAN?', 'LEBAY?', 'ILFIL?'], at = [t0('m4') + 1, t0('m5') + .1, t0('m5') + 1.1];
  cards.forEach((s, i) => { const a = t - at[i], up = backOut(seg(a, 0, .3)), x = 220 + i * 320;
    panel(x - 140, 300, 280, 360, (w, h) => { tone(0, 0, w, h, .35); person(w / 2, 220, 1.4, { tone: .8, shirt: '#3A3A3A' }); });
    if (up > 0) { ctx.save(); ctx.translate(x, 740); ctx.scale(up, up); ctx.rotate((i - 1) * .08); GAYA.shape(rr(-150, -60, 300, 120, 14), '#FFFFFF', 630 + i, { lw: 5 }); ctx.font = `700 ${s.length > 8 ? 38 : 52}px ${FONT}`; ctx.fillStyle = C.red; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(s, 0, 2); ctx.restore(); } });
  clawd(540, 1290, 30, { face: t > t0('m5') ? 'worried' : 'curious', phone: true, arms: [.9, .2], mark: t > t0('m5') + 1 ? 'sweat' : '?', markAge: t > t0('m5') + 1 ? t - t0('m5') - 1 : age('m4') - .5, rot: Math.sin(t * 20) * .02 * seg(t, t0('m5'), t0('m5') + .5) });
};
// HAPUS: delete, type again, delete again... "wkwk" goes out
S.hapus = (t) => {
  room(t, 1);
  const a = age('m6'), cyc = a < 0 ? 9 : a < .8 ? lerp(9, 0, a / .8) : a < 1.6 ? lerp(0, 6, (a - .8) / .8) : a < 2.4 ? lerp(6, 0, (a - 1.6) / .8) : 0, sent = t > t0('m7') + 1.2;
  chatPhone(t, { lines: sent ? 0 : cyc, sent: sent ? t - t0('m7') - 1.2 : null, sentBtn: sent });
  const del = a > 0 && a < .8 || a > 1.6 && a < 2.4;
  if (del) sfxWord(a < .8 ? 'HAPUS!' : 'HAPUS LAGI!', 300, 1180, 80, -.15, (a < .8 ? a : a - 1.6), '#FFFFFF');
  clawd(900, 1330, 18, { face: sent ? 'sad' : 'worried', arms: [.2, 1.2], mark: sent ? 'cloud' : 'sweat', markAge: sent ? t - t0('m7') - 1.2 : a });
};
// GRUP: the class group chat; a question about homework typed, thumb on send... deleted
S.grup = (t) => {
  ctx.fillStyle = '#F2EFE8'; ctx.fillRect(0, 0, W, H); tone(0, 0, W, H, .12);
  const typed = seg(t, t0('m9') + .3, t0('m9') + 2.3), del = seg(t, t0('m11') + .2, t0('m11') + 1), q = 'Bu, tugasnya dikumpul kapan?';
  phone(540, 860, .92, (w, h) => {
    ctx.fillStyle = '#C9E7D2'; ctx.fillRect(0, 0, w, 86); ctx.fillStyle = INK; ctx.font = `700 32px ${FONT}`; ctx.fillText('Grup Kelas 12 IPA 2', 30, 56);
    const msgs = [['Rani', 'besok ulangan ya?'], ['Dimas', 'iya kayaknya'], ['Bu Sari', 'jangan lupa tugas bab 3']];
    msgs.forEach(([n, m], i) => { const y = 160 + i * 120; bubble(190, y, 300, 80, null, null, {}); ctx.font = `700 22px ${FONT}`; ctx.fillStyle = '#4F7FB8'; ctx.fillText(n, 60, y - 18); ctx.font = `500 26px ${FONT}`; ctx.fillStyle = INK; ctx.fillText(m, 60, y + 16); });
    GAYA.shape(rr(20, h - 110, w - 120, 80, 26), '#FFFFFF', 760, { lw: 4 });
    const shown = q.slice(0, Math.round(q.length * typed * (1 - del))); ctx.font = `500 26px ${FONT}`; ctx.fillStyle = INK; ctx.fillText(shown, 40, h - 60);
    GAYA.shape(ell(w - 55, h - 70, 36, 36, 18), '#4F7FB8', 761, { lw: 3 });
  });
  // the hesitating thumb over the send button
  if (t > t0('m10') - .2 && del < 1) { const hov = Math.sin(t * 8) * 10; ctx.save(); ctx.translate(745 + hov, 1215 + 60); ctx.rotate(-.5); GAYA.shape(rr(-34, -10, 68, 150, 30), '#E8B48F', 762, { lw: 4 }); ctx.restore(); }
  clawd(170, 1360, 15, { face: t > t0('m11') ? 'sad' : 'worried', mark: t > t0('m11') + 1 ? 'sweat' : null, markAge: t - t0('m11') - 1 });
  if (t < t0('m9')) tag('Atau di *grup kelas*', 540, 300, 80, { age: age('m8') + .2 });
  else if (t < t0('m11')) tag('Takut dikira *nggak nyimak*', 540, 300, 70, { age: age('m9') });
  else tag('...pura-pura *nggak jadi*', 540, 300, 76, { age: age('m11') });
};
// KACA: a giant magnifying glass over the message, eyes behind it; then a clock eats 10 minutes
S.kaca = (t) => {
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H); focusLines(540, 820, 360, 70, INK, .1, 6);
  if (t < t0('m13')) {
    bubble(540, 820, 520, 220, null, null, { bg: '#BFE3FF' }); textLines(320, 760, 440, 4, 36, 1);
    for (let i = 0; i < 7; i++) { const a = i / 7 * TAU + T * .3, x = 540 + Math.cos(a) * 420, y = 820 + Math.sin(a) * 380; GAYA.shape(ell(x, y, 44, 28, 16), '#FFFFFF', 770 + i, { lw: 4 }); ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x + (540 - x) * .03, y + (820 - y) * .03, 12, 0, TAU); ctx.fill(); }
    const r = 190, gx = 540 + Math.sin(t * 1.5) * 120, gy = 820 + Math.cos(t * 1.2) * 40; ctx.save(); ctx.beginPath(); ctx.arc(gx, gy, r, 0, TAU); ctx.clip(); ctx.translate(gx, gy); ctx.scale(1.6, 1.6); ctx.translate(-gx, -gy); bubble(540, 820, 520, 220, null, null, { bg: '#BFE3FF' }); textLines(320, 760, 440, 4, 36, 1); ctx.restore();
    GAYA.line(ell(gx, gy, r, r, 48).concat([[gx + r, gy]]), 12, INK, 778, 1); GAYA.line([[gx + r * .7, gy + r * .7], [gx + r * 1.4, gy + r * 1.4]], 30, INK, 779, 1);
    tag('Dibaca pakai *kaca pembesar*', 540, 300, 72, { age: age('m12') });
  } else {
    const a = age('m13'), k = seg(a, .2, 3.5); GAYA.shape(ell(540, 800, 260, 260, 48), '#FFFFFF', 780, { lw: 8 });
    for (let i = 0; i < 12; i++) { const an = i / 12 * TAU; GAYA.line([[540 + Math.cos(an) * 220, 800 + Math.sin(an) * 220], [540 + Math.cos(an) * 245, 800 + Math.sin(an) * 245]], 6, INK, 781 + i, 1); }
    ctx.fillStyle = rgba(C.red, .35); ctx.beginPath(); ctx.moveTo(540, 800); ctx.arc(540, 800, 240, -Math.PI / 2, -Math.PI / 2 + k * TAU / 6); ctx.fill();
    const an = -Math.PI / 2 + k * TAU / 6; GAYA.line([[540, 800], [540 + Math.cos(an) * 200, 800 + Math.sin(an) * 200]], 10, INK, 795, 1);
    tag('*10 menit* buat 1 pesan', 540, 300, 80, { age: a });
    clawd(540, 1330, 18, { face: 'sad', mark: 'cloud', markAge: a - .5 });
  }
};
// DUGAAN: the usual guesses: low confidence meter, "baper", a brave "BODO AMAT!", next day... again; a big NO
S.dugaan = (t) => {
  ctx.fillStyle = '#FFF7E8'; ctx.fillRect(0, 0, W, H); tone(0, 0, W, H, .06);
  if (t < t0('d3')) {
    GAYA.shape(rr(160, 480, 760, 90, 40), '#FFFFFF', 800, { lw: 5 }); const v = lerp(.8, .18, ease(seg(age('d1'), .5, 1.8))); GAYA.shape(rr(170, 490, 740 * v, 70, 34), C.red, 801, { lw: 3 });
    ctx.font = `700 44px ${FONT}`; ctx.fillStyle = INK; ctx.fillText('percaya diri', 170, 450);
    if (t > t0('d2')) { const k = backOut(seg(age('d2'), 0, .3)); ctx.save(); ctx.translate(780, 720); ctx.rotate(.1); ctx.scale(k, k); GAYA.shape(rr(-150, -55, 300, 110, 18), '#FFC9C2', 802, { lw: 5 }); ctx.font = `700 60px ${FONT}`; ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('BAPER', 0, 3); ctx.textAlign = 'left'; ctx.restore(); }
    clawd(400, 1300, 26, { face: t > t0('d2') ? 'sad' : 'worried', arms: [.2, .2] });
    tag('Dikira: *kurang percaya diri*', 540, 300, 70, { age: age('d1') });
  } else if (t < t0('d4')) {
    focusLines(540, 900, 300, 70, '#E3A33B', .35, 8); sfxWord('BODO AMAT!', 540, 620, 120, -.06, age('d3') + .1, '#F5C542');
