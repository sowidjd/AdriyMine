<title>Studio Kode</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: satu kolom sempit seperti alat di HP — editor di atas, layar video di bawah. */
:root{--bg:#f4f5f7;--panel:#ffffff;--garis:#d9dde4;--teks:#151a22;--redup:#5b6573;--aksen:#e8890c;--aksen-teks:#1a1205;--bahaya:#c2311f;--kode:#0f1724;--kode-teks:#dbe4f0;
--f-judul:"Space Grotesk",system-ui,sans-serif;--f-isi:"Inter",system-ui,sans-serif;--f-kode:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1118;--panel:#151b25;--garis:#263142;--teks:#e7ecf3;--redup:#93a0b3;--aksen:#f59e0b;--aksen-teks:#1a1205;--bahaya:#f87171;--kode:#0a0e15;--kode-teks:#dbe4f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1118;--panel:#151b25;--garis:#263142;--teks:#e7ecf3;--redup:#93a0b3;--aksen:#f59e0b;--aksen-teks:#1a1205;--bahaya:#f87171;--kode:#0a0e15;--kode-teks:#dbe4f0;color-scheme:dark}
body{background:var(--bg);color:var(--teks);font:15px/1.5 var(--f-isi);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:680px;margin:0 auto;padding-block:20px 40px;display:grid;gap:16px}
header h1{font:700 26px/1.1 var(--f-judul);margin:0;letter-spacing:-.01em}header p{margin:6px 0 0;color:var(--redup);max-width:60ch}
.panel{background:var(--panel);border:1px solid var(--garis);border-radius:14px;padding:14px;display:grid;gap:10px;min-width:0}
label{font-size:13px;color:var(--redup);display:grid;gap:4px;min-width:0}
textarea{width:100%;min-height:300px;background:var(--kode);color:var(--kode-teks);border:1px solid var(--garis);border-radius:10px;padding:12px;font:13px/1.45 var(--f-kode);resize:vertical;tab-size:2}
input{width:100%;min-width:0;box-sizing:border-box;background:var(--bg);color:var(--teks);border:1px solid var(--garis);border-radius:8px;padding:8px;font:inherit;font-variant-numeric:tabular-nums}
.atur{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}@media (max-width:420px){.atur{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tombol{display:flex;flex-wrap:wrap;gap:8px}
button{background:var(--aksen);color:var(--aksen-teks);border:0;border-radius:10px;padding:11px 16px;font:700 15px var(--f-isi);cursor:pointer}
button.kedua{background:transparent;color:var(--teks);border:1px solid var(--garis)}button:disabled{opacity:.45;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--aksen);outline-offset:2px}
.layar{width:100%;max-width:100%;max-height:70vh;margin:0 auto;background:#000;border-radius:10px;overflow:hidden}
.hasil{width:100%;max-height:70vh;border-radius:10px;background:#000}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--aksen);transition:width .2s}
.kecil{font-size:13px;color:var(--redup);margin:0;font-variant-numeric:tabular-nums}
.galat{background:color-mix(in srgb,var(--bahaya) 12%,transparent);color:var(--bahaya);border:1px solid var(--bahaya);border-radius:10px;padding:10px 12px;font:13px/1.45 var(--f-kode);white-space:pre-wrap;overflow-x:auto}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&family=Space+Grotesk:wght@700&display=swap">
<div id="app"><main><header><h1>Studio Kode</h1><p>Memuat editor…</p></header></main></div>
<script type="module" src="app.js"></script>
