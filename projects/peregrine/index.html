<!doctype html>
<html>
<head><meta charset="utf-8"><title>Peregrine Falcon</title>
<style>
@font-face { font-family: 'Fredoka'; src: url(fonts/fredoka-latin.woff2) format('woff2'); font-weight: 300 700; }
html,body{margin:0;background:#222}canvas{height:100vh;display:block;margin:auto}
</style></head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// "Burung seberat sebungkus beras ini lebih cepat dari Whoosh" — gaya pensil warna (colored-pencil science illustration).
// Jam video = narasi: window.TL = timeline.json (diisi render.mjs). renderAt(t) menggambar satu frame; CUES = efek suara.
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = 'Fredoka, "DejaVu Sans", sans-serif';
const C = { paper: '#F8F4EA', graph: '#33241C', sky: '#B3D4E6', grass: '#8DAA45', clay: '#D97757', clayDk: '#A84D33', amber: '#E3A33B', slate: '#56657A',
  slateDk: '#3C4757', belly: '#EFE6D2', helmet: '#2E3440', yellow: '#E8B730', white: '#FCFAF0', red: '#C8463C', cream: '#FFF6E2', blue: '#5D86B8' };
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k, seg = (t, a, b) => clamp((t - a) / (b - a));
const ease = x => { x = clamp(x); return x * x * (3 - 2 * x); }, easeOut = x => 1 - Math.pow(1 - clamp(x), 3), easeIn = x => Math.pow(clamp(x), 3);
const backOut = x => { x = clamp(x); const s = 1.7; return 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
function mixh(a, b, k) { const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16), c = i => Math.round(lerp((pa >> i) & 255, (pb >> i) & 255, clamp(k))); return '#' + ((1 << 24) + (c(16) << 16) + (c(8) << 8) + c(0)).toString(16).slice(1); }
const rgba = (h, a) => { const p = parseInt(h.slice(1), 16); return `rgba(${(p >> 16) & 255},${(p >> 8) & 255},${p & 255},${a})`; };
let T = 0, BOIL = 0;   // only contours boil: 3 drawings cycled, a new one every 2 frames (12/s)

// ---------- timeline (narration is the clock) ----------
const EST = [['h1', 3.6], ['h2', 1.8], ['h3', 2.6], ['k1', 3.8], ['k2', 3.6], ['k3', 3.0], ['d1', 3.2], ['d2', 3.4], ['w1', 3.0], ['w2', 3.4], ['w3', 3.4],
  ['r1', 2.8], ['r1b', 4.0], ['r2', 3.0], ['r2b', 5.4], ['r3', 2.8], ['r3b', 5.6], ['a1', 2.8], ['a2', 2.4], ['f1', 4.2], ['f2', 3.8], ['f3', 4.0], ['f4', 2.0],
  ['e1', 4.4], ['e2', 2.8], ['c1', 6.0], ['c2', 1.4]];
function estTL() { let t = .35; const lines = EST.map(([id, d]) => { const l = { id, t0: t, t1: t + d, cap: '' }; t += d + .3; return l; }); return { duration: t + 1.2, lines }; }
let TL = null, LN = {};
function setTL(tl) { TL = tl; LN = {}; tl.lines.forEach(l => LN[l.id] = l); buildScenes(); }
const t0 = id => LN[id].t0, t1 = id => LN[id].t1;

// ---------- paper & pencil ----------
let PAPER = null, TOOTH = null;
function makePaper() {
  PAPER = document.createElement('canvas'); PAPER.width = W; PAPER.height = H; const p = PAPER.getContext('2d');
  p.fillStyle = C.paper; p.fillRect(0, 0, W, H);
  for (let i = 0; i < 60; i++) { const g = p.createRadialGradient(hash(i) * W, hash(i + 9) * H, 0, hash(i) * W, hash(i + 9) * H, 120 + 200 * hash(i + 3)); g.addColorStop(0, 'rgba(120,90,50,0.035)'); g.addColorStop(1, 'rgba(120,90,50,0)'); p.fillStyle = g; p.fillRect(0, 0, W, H); }
  p.strokeStyle = 'rgba(110,80,50,0.06)'; p.lineWidth = 1;
  for (let i = 0; i < 2600; i++) { const x = hash(i * 3.1) * W, y = hash(i * 7.7) * H, a = hash(i * 1.3) * TAU, l = 4 + 10 * hash(i * 2.9); p.beginPath(); p.moveTo(x, y); p.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke(); }
  TOOTH = document.createElement('canvas'); TOOTH.width = 256; TOOTH.height = 256; const q = TOOTH.getContext('2d'), im = q.createImageData(256, 256);
  for (let i = 0; i < 256 * 256; i++) { const v = 205 + 50 * Math.pow(hash(i * 0.731 + 5), 0.6); im.data[i * 4] = v; im.data[i * 4 + 1] = v; im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  q.putImageData(im, 0, 0);
}
const ell = (cx, cy, rx, ry, n = 28, rot = 0) => Array.from({ length: n }, (_, i) => { const a = i / n * TAU, x = Math.cos(a) * rx, y = Math.sin(a) * ry; return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]; });
function rr(x, y, w, h, r, n = 4) { const P = [], c = [[x + w - r, y + r, -Math.PI / 2], [x + w - r, y + h - r, 0], [x + r, y + h - r, Math.PI / 2], [x + r, y + r, Math.PI]];
  for (const [cx, cy, a0] of c) for (let i = 0; i <= n; i++) { const a = a0 + i / n * Math.PI / 2; P.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); } return P; }
function pathOf(pts, closed = true) { const p = new Path2D(); pts.forEach(([x, y], i) => i ? p.lineTo(x, y) : p.moveTo(x, y)); if (closed) p.closePath(); return p; }
function bbox(pts) { let a = 1e9, b = 1e9, c = -1e9, d = -1e9; for (const [x, y] of pts) { a = Math.min(a, x); b = Math.min(b, y); c = Math.max(c, x); d = Math.max(d, y); } return [a, b, c, d]; }
// hatching inside the current clip: parallel strokes at angle `ang`, stable (seeded by id), short patches slightly re-angled
function hatch(b, col, id, ang = .9, gap = 7, lw = 2.2, alpha = .55) {
  const [x0, y0, x1, y1] = b, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + 10;
  ctx.strokeStyle = rgba(col, alpha); ctx.lineWidth = lw; ctx.lineCap = 'round';
  const n = Math.ceil(2 * R / gap);
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = ang + (hash(id * 13 + Math.floor(i / 6)) - .5) * .25, off = -R + i * gap + (hash(id + i * 3.3) - .5) * 2.5;
    const nx = Math.cos(a + Math.PI / 2), ny = Math.sin(a + Math.PI / 2), dx = Math.cos(a), dy = Math.sin(a);
    const L1 = R * (.75 + .25 * hash(id + i)), s0 = -R + 30 * hash(id * 2 + i);
    ctx.moveTo(cx + nx * off + dx * s0, cy + ny * off + dy * s0); ctx.lineTo(cx + nx * off + dx * L1, cy + ny * off + dy * L1);
  }
  ctx.stroke();
}
// a pencilled shape: L0 broad fill, L1 hatching, optional L2 shadow cross-hatch (shadeFn returns a Path2D), graphite contour
function shape(pts, col, id, o = {}) {
  const p = pathOf(pts), b = bbox(pts);
  ctx.save(); ctx.clip(p);
  ctx.fillStyle = rgba(col, o.fill ?? .62); ctx.fillRect(b[0] - 2, b[1] - 2, b[2] - b[0] + 4, b[3] - b[1] + 4);
  if (o.hatch !== false) hatch(b, o.hcol || mixh(col, C.graph, .12), id, o.ang ?? .85, o.gap ?? 7, o.lw ?? 2.2, o.halpha ?? .5);
  if (o.shade) { ctx.save(); ctx.clip(o.shade); ctx.fillStyle = rgba(mixh(col, '#2B3550', .35), .28); ctx.fillRect(b[0], b[1], b[2] - b[0], b[3] - b[1]); hatch(b, mixh(col, '#2B3550', .45), id + 77, (o.ang ?? .85) + .95, 8, 2, .5); ctx.restore(); }
  ctx.restore();
  if (o.line !== false) contour(pts, true, id, o.lw2 ?? 2.6, o.lcol);
}
function contour(pts, closed, id, lw = 2.6, col = C.graph, alpha = .85) {
  const k = BOIL, j = 1.1;
  ctx.strokeStyle = rgba(col, alpha); ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  const n = pts.length, P = pts.map(([x, y], i) => [x + (hash(id * 31 + i * 7 + k * 101) - .5) * 2 * j, y + (hash(id * 17 + i * 5 + k * 59) - .5) * 2 * j]);
  P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); if (closed) ctx.closePath(); ctx.stroke();
}
const line = (pts, lw = 3, col = C.graph, id = 1, alpha = .85) => contour(pts, false, id, lw, col, alpha);
function sky(top, bottom, id = 5, y1 = H) {
  const g = ctx.createLinearGradient(0, 0, 0, y1); g.addColorStop(0, rgba(top, .7)); g.addColorStop(1, rgba(bottom, .6));
  ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, y1 + 200);
  ctx.save(); ctx.beginPath(); ctx.rect(-200, -200, W + 400, y1 + 200); ctx.clip(); hatch([-200, -200, W + 200, y1], mixh(top, bottom, .5), id, .08, 11, 2.4, .25); ctx.restore();
}
function cloud(x, y, s, id) { const P = []; for (let i = 0; i <= 24; i++) { const a = Math.PI + i / 24 * Math.PI, r = s * (.8 + .25 * Math.sin(i * 1.7 + id)); P.push([x + Math.cos(a) * r * 1.6, y + Math.sin(a) * r * .7]); } shape(P, C.white, id, { fill: .75, halpha: .25, lw2: 2, lcol: '#7B8A99' }); }

// ---------- text on paper ----------
function tag(str, x, y, size, o = {}) {   // a cream paper tag, pencilled edge; *word* = amber highlight
  const k = backOut(seg(o.age ?? 1, 0, .25)), out = 1 - seg(o.age ?? 0, (o.life ?? 99) - .15, o.life ?? 99);
  if (k <= 0 || out <= 0) return;
  ctx.save(); ctx.globalAlpha = out; ctx.translate(x, y); ctx.rotate(o.rot ?? 0); ctx.scale(k, k);
  ctx.font = `700 ${size}px ${FONT}`;
  const words = str.split(' ').map(s => ({ t: s.replace(/\*/g, ''), hi: s.includes('*') })), sp = ctx.measureText(' ').width, maxW = o.maxW ?? 880;
  const lines = [[]]; let w = 0; for (const wd of words) { const ww = ctx.measureText(wd.t).width; if (w + ww > maxW && lines.at(-1).length) { lines.push([]); w = 0; } lines.at(-1).push({ ...wd, w: ww }); w += ww + sp; }
  const lh = size * 1.2, widths = lines.map(l => l.reduce((s, q) => s + q.w, 0) + sp * (l.length - 1)), bw = Math.max(...widths) + size * .9, bh = lines.length * lh + size * .55;
  if (!o.bare) shape(rr(-bw / 2, -bh / 2, bw, bh, 14), o.bg || C.cream, 900 + size, { fill: .96, halpha: .12, gap: 9, lw2: 2.4 });
  ctx.textBaseline = 'middle';
  lines.forEach((ln, i) => { let cx = -widths[i] / 2; const cy = (i - (lines.length - 1) / 2) * lh + size * .04;
    for (const wd of ln) { if (wd.hi) { ctx.fillStyle = rgba(C.amber, .55); ctx.fillRect(cx - 4, cy - size * .05, wd.w + 8, size * .45); }
      ctx.fillStyle = o.col || C.graph; ctx.fillText(wd.t, cx, cy); cx += wd.w + sp; } });
  ctx.restore();
}
function caption(t) {   // the narration line on a paper slip, inside the safe box (y <= 1540)
  if (!TL) return;
  for (const l of TL.lines) if (t >= l.t0 - .05 && t < l.t1 + .25 && l.cap) { tag(l.cap, W / 2, 1440, 52, { age: t - l.t0 + .05, life: l.t1 + .3 - l.t0, maxW: 800 }); break; }
}

// ---------- characters & props ----------
const FACES = { neutral: { eyes: 'normal' }, curious: { eyes: 'normal', look: [.6, -.5], mouth: 'o' }, surprised: { eyes: 'wide', mouth: 'O' },
  squint: { eyes: 'squint', mouth: 'wobble' }, happy: { eyes: 'happy', mouth: 'smile' }, star: { eyes: 'star', mouth: 'O' }, cool: { eyes: 'happy', mouth: 'smirk' } };
function clawd(x, y, u, o = {}) {
  const F = { ...FACES[o.face || 'neutral'], ...o }, sq = o.sq || 0, id = 4000;
  ctx.save(); ctx.translate(x, y + (o.dy || 0) * u); ctx.rotate(o.rot || 0); ctx.scale(1 + sq * .6, 1 - sq);
  const [aL, aR] = o.arms || [.2, .2];
  for (const [side, a] of [[-1, aL], [1, aR]]) { ctx.save(); ctx.translate(side * 4.9 * u, -4.5 * u); ctx.rotate(side < 0 ? a : -a); shape(side < 0 ? [[-2.2 * u, -.5 * u], [0, -.5 * u], [0, .5 * u], [-2.2 * u, .5 * u]] : [[0, -.5 * u], [2.2 * u, -.5 * u], [2.2 * u, .5 * u], [0, .5 * u]], C.clay, id + side * 3, { lw2: 2.2 }); ctx.restore(); }
  [-4, -2, 1, 3].forEach((lx, i) => shape([[lx * u, -2.3 * u], [(lx + 1) * u, -2.3 * u], [(lx + 1) * u, 0], [lx * u, 0]], C.clayDk, id + 10 + i, { lw2: 2.2 }));
  shape(rr(-5 * u, -8 * u, 10 * u, 6 * u, u * .3), C.clay, id + 20, { shade: new Path2D(pathOf([[-5 * u, -3.6 * u], [5 * u, -3.6 * u], [5 * u, -2 * u], [-5 * u, -2 * u]])) });
  const [lx, ly] = F.look || [0, 0];
  for (const s of [-1, 1]) { const ex = s * 2.5 * u + lx * .5 * u, ey = -6 * u + ly * .5 * u;
    if (F.eyes === 'wide') { shape(ell(ex, ey, .6 * u, 1.05 * u, 18), C.graph, id + 30 + s, { fill: .95, hatch: false, line: false }); ctx.fillStyle = C.white; ctx.beginPath(); ctx.arc(ex + .2 * u, ey - .45 * u, .17 * u, 0, TAU); ctx.fill(); }
    else if (F.eyes === 'happy') line([[s * 2.5 * u - .7 * u, -5.8 * u], [s * 2.5 * u, -6.5 * u], [s * 2.5 * u + .7 * u, -5.8 * u]], u * .2, C.graph, id + 40 + s);
    else if (F.eyes === 'squint') { line([[s * 2.5 * u - .8 * u, -6.4 * u], [s * 2.5 * u + .1 * u, -6 * u], [s * 2.5 * u - .8 * u, -5.6 * u]].map(([px, py]) => [s < 0 ? px : 2 * s * 2.5 * u - px, py]), u * .2, C.graph, id + 45 + s); }
    else if (F.eyes === 'star') { const P = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? .38 * u : .95 * u; P.push([s * 2.5 * u + Math.cos(a) * r, -6 * u + Math.sin(a) * r]); } shape(P, C.amber, id + 50 + s, { fill: .95, hatch: false, lw2: 2 }); }
    else shape(ell(ex, ey, .38 * u, .95 * u, 16), C.graph, id + 60 + s, { fill: .95, hatch: false, line: false }); }
  const m = F.mouth, my = -4.2 * u;
  if (m === 'O') shape(ell(0, my, .5 * u, .65 * u, 14), C.graph, id + 70, { fill: .9, hatch: false, line: false });
  else if (m === 'o') shape(ell(0, my, .28 * u, .32 * u, 12), C.graph, id + 71, { fill: .9, hatch: false, line: false });
  else if (m === 'smile') line([[-.9 * u, my - .15 * u], [0, my + .35 * u], [.9 * u, my - .15 * u]], u * .18, C.graph, id + 72);
  else if (m === 'smirk') line([[-.7 * u, my + .1 * u], [.2 * u, my + .2 * u], [.9 * u, my - .25 * u]], u * .18, C.graph, id + 73);
  else if (m === 'wobble') line([[-1 * u, my], [-.5 * u, my - .25 * u], [0, my + .1 * u], [.5 * u, my - .25 * u], [1 * u, my]], u * .18, C.graph, id + 74);
  if (o.goggles) { for (const s of [-1, 1]) shape(ell(s * 2.5 * u, -6 * u, 1.35 * u, 1.25 * u, 20), '#9CCFE8', id + 80 + s, { fill: .35, hatch: false, lw2: u * .22 }); line([[-1.15 * u, -6 * u], [1.15 * u, -6 * u]], u * .22, C.graph, id + 83); }
  if (o.binoculars) { for (const s of [-1, 1]) shape(rr(s * 1.25 * u - 1 * u, -7 * u, 2 * u, 2.2 * u, .4 * u), C.graph, id + 90 + s, { fill: .9, halpha: .3 }); }
  ctx.restore();
}
// The falcon, side view facing right, length ~2.2*s. o.fold 0 (wings spread) .. 1 (stoop teardrop); o.flap -1..1; o.perch (upright with feet)
function falcon(x, y, s, o = {}) {
  const fold = clamp(o.fold ?? 0), flap = o.flap ?? 0, id = o.id ?? 7000;
  ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot ?? 0); ctx.scale(o.flip ? -1 : 1, 1);
  const body = []; const len = lerp(1, 1.12, fold), th = lerp(.24, .17, fold);
  for (let i = 0; i <= 20; i++) { const u = i / 20, xx = lerp(.55, -.62, u) * len, w = th * Math.sin(Math.PI * Math.pow(u, .7)) * (1 - .35 * u); body.push([xx * s, -w * s]); }
  for (let i = 20; i >= 0; i--) { const u = i / 20, xx = lerp(.55, -.62, u) * len, w = th * .9 * Math.sin(Math.PI * Math.pow(u, .7)) * (1 - .3 * u); body.push([xx * s, w * s]); }
  // tail
  const tl = -.6 * len * s; shape([[tl, -.05 * s], [tl - lerp(.42, .3, fold) * s, -lerp(.12, .04, fold) * s], [tl - lerp(.45, .32, fold) * s, lerp(.1, .03, fold) * s], [tl, .06 * s]], C.slateDk, id + 1, { ang: 0 });
  // far wing (behind), near wing (front)
  const wing = (far) => {
    const up = far ? .75 : 1, f = flap * (far ? .8 : 1);
    const tip = [lerp(-.25, -.66, fold) * s, lerp(-.95 * up - .35 * f, -.08, fold) * s], mid = [lerp(.02, -.35, fold) * s, lerp(-.45 * up - .2 * f, -.1, fold) * s];
    const P = [[.22 * s, -.1 * s], mid, tip, [lerp(-.3, -.6, fold) * s, lerp(-.55 * up - .2 * f, -.02, fold) * s], [-.25 * s, -.05 * s]];
    shape(P, far ? C.slateDk : C.slate, id + (far ? 3 : 4), { ang: -.6, shade: far ? null : new Path2D(pathOf([[-.6 * s, -1.2 * s], [.3 * s, -1.2 * s], [-.1 * s, -.2 * s], [-.6 * s, -.1 * s]])) });
    if (!far && fold < .8) for (let i = 0; i < 4; i++) line([[lerp(mid[0], tip[0], .2 + i * .2), lerp(mid[1], tip[1], .2 + i * .2)], [lerp(mid[0], tip[0], .2 + i * .2) - .12 * s, lerp(mid[1], tip[1], .2 + i * .2) + .14 * s]], 1.6, C.graph, id + 20 + i, .5);
  };
  if (!o.perch) wing(true);
  shape(body, C.slate, id + 5, { ang: .2, shade: new Path2D(pathOf([[-1 * s, 0], [.6 * s, 0], [.6 * s, .4 * s], [-1 * s, .4 * s]])) });
  // pale barred belly
  ctx.save(); ctx.clip(pathOf(body)); shape([[.5 * s, .02 * s], [-.5 * s, .04 * s], [-.5 * s, .4 * s], [.5 * s, .4 * s]], C.belly, id + 6, { ang: 1.4, halpha: .3, line: false });
  for (let i = 0; i < 9; i++) line([[(.35 - i * .09) * s, (.08 + .03 * (i % 2)) * s], [(.31 - i * .09) * s, (.12 + .03 * (i % 2)) * s]], 2.4, C.slateDk, id + 30 + i, .7); ctx.restore();
  if (o.perch) { for (const k of [0, 1]) { line([[(-.02 + k * .1) * s, .18 * s], [(0 + k * .1) * s, .36 * s]], s * .04, C.yellow, id + 40 + k, 1); line([[(-.06 + k * .1) * s, .37 * s], [(.08 + k * .1) * s, .37 * s]], s * .03, C.yellow, id + 42 + k, 1); } }
  // head: dark helmet + moustache, white cheek, yellow eye-ring, hooked beak
  const hx = .52 * len * s, hy = -.06 * s, hr = .17 * s;
  shape(ell(hx, hy, hr, hr * .95, 22), C.white, id + 7, { fill: .9, halpha: .15 });
  ctx.save(); ctx.clip(pathOf(ell(hx, hy, hr, hr * .95, 22)));
  shape([[hx - hr * 1.2, hy - hr * 1.2], [hx + hr * 1.1, hy - hr * 1.2], [hx + hr * .6, hy - hr * .15], [hx + hr * .1, hy - hr * .05], [hx + hr * .15, hy + hr * .9], [hx - hr * .25, hy + hr * 1.1], [hx - hr * 1.2, hy + hr]], C.helmet, id + 8, { fill: .9, line: false });
  ctx.restore(); contour(ell(hx, hy, hr, hr * .95, 22), true, id + 9);
  shape([[hx + hr * .82, hy - hr * .25], [hx + hr * 1.45, hy - hr * .05], [hx + hr * 1.35, hy + hr * .3], [hx + hr * 1.12, hy + hr * .22], [hx + hr * .85, hy + hr * .2]], '#C9B47A', id + 10, { fill: .9, halpha: .2, lw2: 2 });
  shape(ell(hx + hr * .45, hy - hr * .2, hr * .3, hr * .3, 14), C.yellow, id + 11, { fill: .95, hatch: false, lw2: 1.8 });
  ctx.fillStyle = C.graph; ctx.beginPath(); ctx.arc(hx + hr * .5, hy - hr * .2, hr * .16, 0, TAU); ctx.fill();

// RECORD: Adriy.Project tag, "320 BUKAN rekornya", 1999 card, plane at 5.000 m, gauge smashes past 350, falcon overtakes the train
S.rec = (t) => {

// ---------- sound cues (sfx-kit, CC0) ----------
let CUES = [];
function buildCues() {
  const c = (t, f, g = 1) => CUES.push([+t.toFixed(3), f, g]); CUES = [];
  c(0, 'whooshes/whoosh-slow-hard', .9); c(0, 'booms-and-bass/bass-rumble-short', .5); c(t0('h2') - .05, 'whooshes/whoosh-fast-hard', 1);
  c(t0('h3') - .2, 'impacts/impact-heavy-firm', .8); c(t0('h3') + .1, 'pops/pop-medium-in', .7);
  c(t0('k1') - .3, 'reverse-whooshes/reverse-whoosh-medium-soft', .6); c(t0('k1') + .3, 'writing-and-drawing/writing-pencil-write', .5);
  c(t0('d1') + .6, 'whooshes/whoosh-medium-soft', .7); c(t0('d2') - 1.6, 'risers-and-fallers/riser-2s-strong', .7); c(t0('d2'), 'cinematic-hits/cinematic-drum-big', .7); c(t0('d2') - .2, 'data/data-countup-medium', .6);

  for (const id of ['r1', 'r2', 'r3']) { c(t0(id) - .25, 'whooshes/whoosh-medium-medium', .6); c(t0(id) + .1, 'writing-and-drawing/writing-pencil-draw', .45); }
  c(t0('r3b') + 1.6, 'pops/pop-large-in', .6);
  c(t0('a1'), 'risers-and-fallers/riser-2s-soft', .5); c(t0('a2') + .6, 'impacts/impact-medium-hard', .8);
  c(t0('f1') - .2, 'whooshes/whoosh-medium-soft', .6); c(t0('f2') + .2, 'booms-and-bass/bass-rumble-long', .35); c(t0('f2') + 1.2, 'risers-and-fallers/faller-2s-soft', .6);

}

// ---------- render ----------
function renderAt(t) {
  T = t; BOIL = Math.floor(t * 12) % 3;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.drawImage(PAPER, 0, 0);
  const i = Math.max(0, SC.findIndex(s => t >= s.a && t < s.b)), s = SC[i < 0 ? SC.length - 1 : i];
  ctx.save(); S[s.name](t); ctx.restore();
  // transition: the new scene is revealed by a growing pencilled circle over the old one (0.45 s)
  const prev = SC[i - 1], k = seg(t, s.a, s.a + .45);
  if (prev && k < 1) { ctx.save(); const r = easeOut(k) * 1300; ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.arc(540, 900, r, 0, TAU, true); ctx.clip('evenodd'); ctx.drawImage(PAPER, 0, 0); S[prev.name](t); ctx.restore(); contour(ell(540, 900, easeOut(k) * 1300, easeOut(k) * 1300, 64), true, 9999, 6); }
  caption(t);
  // paper tooth over everything (pencil only lands on the raised grain)
  ctx.globalCompositeOperation = 'multiply'; ctx.globalAlpha = .45; ctx.fillStyle = ctx.createPattern(TOOTH, 'repeat'); ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  if (t < .2) { ctx.fillStyle = `rgba(20,16,12,${1 - t / .2})`; ctx.fillRect(0, 0, W, H); }
  if (TL && t > TL.duration - .35) { ctx.fillStyle = `rgba(20,16,12,${seg(t, TL.duration - .35, TL.duration)})`; ctx.fillRect(0, 0, W, H); }
  return cv.toDataURL('image/jpeg', .9);
}
